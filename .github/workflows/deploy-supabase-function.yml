name: Deploy Supabase Function

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: Supabase Edge Function to deploy
        required: true
        type: choice
        options:
          - account-deletion-request
          - account-request-cancel
          - account-delete
          - parent-link-revoke
      confirm_project:
        description: Type tbsevonvegdnlyjgplmm to confirm the target project
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-supabase-${{ inputs.function_name }}
  cancel-in-progress: false

env:
  EXPECTED_HEAD_SHA: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: production

    steps:
      - name: Verify project
        shell: bash
        run: |
          if [ "${{ inputs.confirm_project }}" != "tbsevonvegdnlyjgplmm" ]; then
            echo "Project confirmation did not match."
            exit 1
          fi

      - name: Check out exact dispatch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact target is current main
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          git fetch --no-tags --depth=1 origin main
          current_main="$(git rev-parse FETCH_HEAD)"
          printf 'expected=%s\nactual=%s\ncurrent_main=%s\n' "$EXPECTED_HEAD_SHA" "$actual" "$current_main"
          test "$EXPECTED_HEAD_SHA" = "$current_main"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.113.0

      - name: Verify access token
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }

      - name: Re-verify current main immediately before mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          current_main="$(git rev-parse FETCH_HEAD)"
          printf 'expected=%s\ncurrent_main=%s\n' "$EXPECTED_HEAD_SHA" "$current_main"
          test "$EXPECTED_HEAD_SHA" = "$current_main"

      - name: Deploy selected function
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ "${{ inputs.function_name }}" = "account-delete" ]; then
            supabase functions deploy "${{ inputs.function_name }}" \
              --project-ref tbsevonvegdnlyjgplmm \
              --no-verify-jwt
          else
            supabase functions deploy "${{ inputs.function_name }}" \
              --project-ref tbsevonvegdnlyjgplmm
          fi

      - name: Summary
        run: echo "Deployed ${{ inputs.function_name }} from exact main $EXPECTED_HEAD_SHA to tbsevonvegdnlyjgplmm."
