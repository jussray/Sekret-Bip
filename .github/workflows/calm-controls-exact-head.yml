name: Calm Controls Exact-Head Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/screens/CalmScreen.tsx'
      - 'app/(teen)/calm/**'
      - 'test/calm-plan-controls.test.mjs'
      - 'docs/CALM_CONTROLS_STRIDE.md'
      - '.github/workflows/calm-controls-exact-head.yml'
  push:
    branches: [main]
    paths:
      - 'src/screens/CalmScreen.tsx'
      - 'app/(teen)/calm/**'
      - 'test/calm-plan-controls.test.mjs'
      - 'docs/CALM_CONTROLS_STRIDE.md'
      - '.github/workflows/calm-controls-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-calm-controls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bip_test
          POSTGRES_PASSWORD: bip_test_ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bip_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    timeout-minutes: 30
    env:
      SEKRET_TEST_PG_URL: postgres://postgres:bip_test_ephemeral@127.0.0.1:5432/bip_test # DevSkim: ignore DS162092 because this is an isolated disposable CI loopback database
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 1

      - name: Record and verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'event=%s\nexpected=%s\nactual=%s\n' "$GITHUB_EVENT_NAME" "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install repository dependencies
        run: npm ci
      - name: Verify disposable Postgres for guardian authorization suite
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql "$SEKRET_TEST_PG_URL" -v ON_ERROR_STOP=1 -c 'select current_database();'

      - name: Run focused Calm contracts
        run: node --test test/calm-plan-controls.test.mjs

      - name: Type-check exact head
        run: npm run type-check

      - name: Run complete unit suite
        run: npm test

      - name: Run repository lint
        run: npm run lint

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calm-controls-evidence-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            docs/CALM_CONTROLS_STRIDE.md
            test/calm-plan-controls.test.mjs
          if-no-files-found: error
          retention-days: 30
