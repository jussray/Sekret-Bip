name: Repair obsolete Expo AV on SDK 58
on:
  push:
    branches: [repair/eas-android-bundle-44159812926]
    paths: [.github/workflows/eas-logbox-dependency-repair.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Migrate audio and video modules to Expo SDK 58
        shell: bash
        run: |
          set -euo pipefail
          npm uninstall expo-av --save --ignore-scripts
          npm install 'expo-audio@~58.0.12' 'expo-video@~58.0.14' --save --ignore-scripts
          npm ci
          node --test test/voice-bip-metadata-lifecycle.test.mjs test/expo58-audio-contract.test.mjs
          npm run type-check
          node <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          if (pkg.dependencies?.['expo-av'] || lock.packages?.['']?.dependencies?.['expo-av'] || lock.packages?.['node_modules/expo-av']) throw new Error('Obsolete expo-av remains');
          for (const name of ['expo-audio', 'expo-video']) {
            if (!pkg.dependencies?.[name]?.startsWith('~58.')) throw new Error('SDK 58 dependency not declared: ' + name);
            if (!lock.packages?.['node_modules/' + name]?.version?.startsWith('58.')) throw new Error('SDK 58 dependency not locked: ' + name);
          }
          if (!lock.packages?.['node_modules/expo']?.version?.startsWith('58.')) throw new Error('Expo SDK drift detected');
          console.log('Expo 58 audio/video dependency contract passed');
          NODE
          git diff --check
          git diff --stat -- package.json package-lock.json
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency change to commit.'
            exit 1
          fi
      - name: Commit only dependency repair to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix(android): replace unsupported expo-av with SDK 58 audio/video modules'
          git push origin HEAD:repair/eas-android-bundle-44159812926
          git log -1 --format='%H %s'
