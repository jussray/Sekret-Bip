name: GitHub Merge Membrane

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: github-merge-membrane-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  MERGE_MEMBRANE_EVIDENCE_PATH: artifacts/github-merge-membrane.json

jobs:
  merge-membrane:
    name: merge-membrane
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out trusted base evaluator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRUSTED_BASE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted base evaluator
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'trusted_base=%s\nactual=%s\nproof_subject=%s\n' "$TRUSTED_BASE_SHA" "$actual" "$EXPECTED_HEAD_SHA"
          test "$actual" = "$TRUSTED_BASE_SHA"
          test -n "$EXPECTED_HEAD_SHA"

      - name: Confirm trusted base carries the merge-membrane evaluator
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for f in test/github-merge-membrane.test.mjs scripts/verify-github-merge-membrane.mjs; do
            if [ ! -f "$f" ]; then
              echo "::error::Trusted base $TRUSTED_BASE_SHA is missing $f." >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::PR #$PR_NUMBER's base predates the merge-membrane evaluator's introduction to main. This gate evaluates from the PR's declared base (not its head or current main) so a PR cannot weaken its own required-checks policy — but that means a base from before the evaluator existed can never satisfy it. Rebase PR #$PR_NUMBER onto a current main commit that includes test/github-merge-membrane.test.mjs and scripts/verify-github-merge-membrane.mjs, then re-sync." >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Verify trusted merge-membrane contracts
        run: node --test test/github-merge-membrane.test.mjs

      - name: Require exact-head machine proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-github-merge-membrane.mjs

      - name: Retain merge-membrane receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-merge-membrane-${{ env.EXPECTED_HEAD_SHA }}
          path: artifacts/github-merge-membrane.json
          if-no-files-found: ignore
          retention-days: 30

  live-main-audit:
    name: Live main and exact candidate ancestry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live main, current PR head, and ancestry (read-only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD_SHA: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          sha_pattern='^[0-9a-f]{40}$'
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          [[ "$current_main" =~ $sha_pattern ]] || { echo "::error::Cannot resolve live main SHA"; exit 1; }
          [[ "$EVENT_HEAD_SHA" =~ $sha_pattern ]] || { echo "::error::Invalid candidate SHA"; exit 1; }
          candidate="$EVENT_HEAD_SHA"
          if [[ -n "$PR_NUMBER" ]]; then
            live_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            live_head="$(jq -r '.head.sha // empty' <<<"$live_pr")"
            live_base="$(jq -r '.base.sha // empty' <<<"$live_pr")"
            live_base_ref="$(jq -r '.base.ref // empty' <<<"$live_pr")"
            [[ "$live_base_ref" == "main" ]] || { echo "::error::PR targets ${live_base_ref}, not main"; exit 1; }
            [[ "$live_head" == "$EVENT_HEAD_SHA" ]] || { echo "::error::PR head advanced; event proof is stale"; exit 1; }
            echo "PR base snapshot: ${live_base}; authoritative comparison uses live main ${current_main}"
            candidate="$live_head"
          fi
          merge_base="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${current_main}...${candidate}" --jq '.merge_base_commit.sha')"
          [[ "$merge_base" == "$current_main" ]] || {
            echo "::error::Candidate is not based on live main ${current_main}. Update the branch and rerun exact-head checks."
            exit 1
          }
          if [[ "$GITHUB_REF" == "refs/heads/main" && "$candidate" != "$current_main" ]]; then
            echo "::error::This main run is superseded by ${current_main}"
            exit 1
          fi
          final_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          [[ "$final_main" == "$current_main" ]] || { echo "::error::Main advanced during audit; evidence expired"; exit 1; }
          if [[ -n "$PR_NUMBER" ]]; then
            final_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
            [[ "$final_head" == "$candidate" ]] || { echo "::error::PR head advanced during audit"; exit 1; }
          fi
          {
            echo "### Live main candidate audit"
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Live main: ${current_main}"
            echo "- Candidate: ${candidate}"
            echo "- Merge base: ${merge_base}"
            echo "- Scope: Git ancestry and exact SHA only; tests, merge authorization, deployment and runtime remain separate."
          } >> "$GITHUB_STEP_SUMMARY"
