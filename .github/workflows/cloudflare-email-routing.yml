name: Reconcile Cloudflare Email Routing

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the planned Email Routing and Resend DNS changes to Cloudflare
        required: true
        default: false
        type: boolean
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: cloudflare-email-routing-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BIP_EMAIL_ZONE: sekretbip.net
  BIP_EMAIL_WORKER: sekret-backend
  BIP_EMAIL_DESTINATION: sekretbip@gmail.com

jobs:
  reconcile:
    name: Plan or apply Bip email routing
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 1066 &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.body == '/apply-resend-dns')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Show non-destructive Email Routing plan
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/reconcile-cloudflare-email-routing.mjs

      - name: Show non-destructive Resend DNS plan
        run: node scripts/reconcile-cloudflare-resend-dns.mjs

      - name: Require Cloudflare API token before apply
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.apply == true) ||
          github.event_name == 'issue_comment'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo 'CLOUDFLARE_API_TOKEN is not configured.' >&2
            exit 1
          }

      # Token type and scoped access are validated by the reconcilers themselves.
      # All secret-backed Cloudflare execution must pass through the canonical
      # transport normalizer so pasted quotes/prefixes/formatting cannot reach
      # the Authorization header and non-ASCII credential corruption fails closed.
      - name: Reconcile live Cloudflare Email Routing
        if: github.event_name == 'workflow_dispatch' && inputs.apply == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/run-with-normalized-cloudflare-token.mjs scripts/reconcile-cloudflare-email-routing.mjs --apply

      - name: Reconcile Resend DNS records
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.apply == true) ||
          github.event_name == 'issue_comment'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node scripts/run-with-normalized-cloudflare-token.mjs scripts/reconcile-cloudflare-resend-dns.mjs --apply

      - name: Upload Cloudflare email evidence
        if: >-
          always() &&
          ((github.event_name == 'workflow_dispatch' && inputs.apply == true) ||
           github.event_name == 'issue_comment')
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-email-evidence-${{ github.run_id }}
          path: |
            artifacts/cloudflare-email-routing-evidence.json
            artifacts/cloudflare-resend-dns-evidence.json
          if-no-files-found: warn
          retention-days: 30
