name: Settings Companion Canon Gate

on:
  pull_request:
    paths:
      - 'app/(teen)/settings.tsx'
      - 'app/(parent)/settings.tsx'
      - 'test/settings-companion-canon.test.mjs'
      - '.github/workflows/settings-companion-canon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-settings-companion-canon:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bip_test
          POSTGRES_PASSWORD: bip_test_ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bip_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    timeout-minutes: 30
    env:
      SEKRET_TEST_PG_URL: postgres://postgres:bip_test_ephemeral@127.0.0.1:5432/bip_test # DevSkim: ignore DS162092 because this is an isolated disposable CI loopback database
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 1

      - name: Record and verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install repository dependencies
        run: npm ci
      - name: Verify disposable Postgres for guardian authorization suite
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client ffmpeg
          psql "$SEKRET_TEST_PG_URL" -v ON_ERROR_STOP=1 -c 'select current_database();'
          ffmpeg -version
          ffprobe -version
          psql "$SEKRET_TEST_PG_URL" -v ON_ERROR_STOP=1 -c "CREATE TABLE public.guardian_fixture_disposable_sentinel (marker text primary key); INSERT INTO public.guardian_fixture_disposable_sentinel (marker) VALUES ('guardian-consent-disposable-v1');"

      - name: Run focused settings canon contracts
        run: node --test test/settings-companion-canon.test.mjs

      - name: Type-check exact head
        run: npm run type-check

      - name: Run complete unit suite
        run: npm test

      - name: Run repository lint
        run: npm run lint
