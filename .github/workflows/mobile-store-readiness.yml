name: Mobile Store Readiness

on:
  push:
    branches:
      - main
      - chore/eas-build-config
      - repair/eas-android-bundle-44159812926
    paths:
      - app.json
      - app.config.ts
      - eas.json
      - package.json
      - package-lock.json
      - app/(parent)/_layout.tsx
      - e2e/smoke.spec.ts
      - scripts/verify-mobile-store-release.mjs
      - .github/workflows/eas-build.yml
      - .github/workflows/mobile-store-readiness.yml
      - constants/theme.ts
      - constants/theme.base.ts
      - test/companion-runtime-contracts.test.mjs
      - test/room-intentions-hierarchy-contract.test.mjs
      - .easignore
  pull_request:
    paths:
      - app.json
      - app.config.ts
      - eas.json
      - package.json
      - package-lock.json
      - app/(parent)/_layout.tsx
      - e2e/smoke.spec.ts
      - scripts/verify-mobile-store-release.mjs
      - .github/workflows/eas-build.yml
      - .github/workflows/mobile-store-readiness.yml
      - constants/theme.ts
      - constants/theme.base.ts
      - test/companion-runtime-contracts.test.mjs
      - test/room-intentions-hierarchy-contract.test.mjs
      - .easignore
  workflow_dispatch:

concurrency:
  group: mobile-store-readiness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true

jobs:
  contract:
    name: Store contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Report exact proof subject
        run: echo "proof_subject=${GITHUB_SHA}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: node --test test/companion-runtime-contracts.test.mjs test/room-intentions-hierarchy-contract.test.mjs
      - run: node --check scripts/verify-mobile-store-release.mjs
      - run: node scripts/verify-mobile-store-release.mjs
      - run: npm run type-check

  android-bundle-preflight:
    name: Android production JavaScript bundle (teen preview)
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: teen
      EXPO_PUBLIC_APP_VARIANT: teen
      EXPO_PUBLIC_RELEASE_AUDIENCE: beta
      EXPO_PUBLIC_BACKEND_URL: https://sekret-backend-alpha.mcgill-raylene.workers.dev
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Export Android production bundle
        id: android-export
        shell: bash
        run: |
          set +e
          npx --no-install expo export --platform android --clear > android-bundle.log 2>&1
          status=$?
          set -e
          tail -n 200 android-bundle.log
          exit "$status"
      - name: Upload Android bundling diagnostics
        if: failure() && steps.android-export.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: android-bundle-diagnostics-${{ github.sha }}
          path: android-bundle.log
          retention-days: 7
          if-no-files-found: error

  eas-archive-contract:
    name: EAS archive retains room assets
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APP_VARIANT: teen
      EXPO_PUBLIC_APP_VARIANT: teen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Inspect exact EAS project archive without starting a build
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@24.7.0 build:inspect --platform android --stage archive --output /tmp/eas-archive --profile preview --force
          status=0
          for path in assets/images/archive/bg-raylene-room-day.png assets/images/archive/bg-rylane-room-night.png assets/images/archive/bg-cloud-room-day.png; do
            if test -f "/tmp/eas-archive/$path"; then
              echo "PRESENT: $path"
            else
              echo "::error::EAS archive missing runtime asset: $path"
              status=1
            fi
          done
          for path in .env .mcp.json; do
            if test -e "/tmp/eas-archive/$path"; then
              echo "::error::EAS archive contains excluded item: $path"
              status=1
            else
              echo "EXCLUDED: $path"
            fi
          done
          du -sh /tmp/eas-archive
          test "$status" -eq 0
          echo "EAS archive passed runtime asset and exclusion checks."

  playwright-regression:
    name: Playwright front-door regression
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- e2e/smoke.spec.ts

      - name: Verify canonical Teen Room composition
        env:
          EXPO_PUBLIC_ENABLE_FOUNDER_PREVIEW: 'true'
        run: npx playwright test e2e/room-canonical-display.spec.ts --project=chromium

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-store-playwright-${{ github.sha }}
          path: |
            playwright-report
            test-results
            artifacts/product-design-playwright/room-canonical-display
          if-no-files-found: ignore
          retention-days: 30
