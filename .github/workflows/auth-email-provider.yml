name: Configure production Auth email provider

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact main SHA whose signup contract is being configured
        required: true
        type: string
      apply:
        description: Apply Resend SMTP to canonical Supabase Auth
        required: true
        default: false
        type: boolean
      verify_only:
        description: Read back production Auth email settings without changing them
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sekret-auth-email-provider-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SUPABASE_TARGET: sekret-bip-production
  SUPABASE_PROJECT_REF: tbsevonvegdnlyjgplmm
  AUTH_SMTP_HOST: smtp.resend.com
  AUTH_SMTP_PORT: '465'
  AUTH_SMTP_USER: resend
  AUTH_SMTP_ADMIN_EMAIL: invite@sekretbip.net
  AUTH_SMTP_SENDER_NAME: Se'kret Bip

jobs:
  reconcile-auth-email:
    name: Plan, verify or apply production Auth email
    runs-on: ubuntu-latest
    # Founder-owned provider credentials live in the `Production` Actions environment.
    # The Resend key is stored there as the secret `login` and mapped to RESEND_API_KEY.
    environment: Production
    timeout-minutes: 10
    steps:
      - name: Normalize and validate dispatch contract
        id: target
        shell: bash
        env:
          TARGET_SHA_INPUT: ${{ inputs.target_sha }}
          APPLY: ${{ inputs.apply }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$APPLY" = true ] && [ "$VERIFY_ONLY" = true ]; then
            echo '::error title=Conflicting modes::Select either apply or verify_only, never both.'
            exit 64
          fi

          target_sha="$TARGET_SHA_INPUT"
          target_sha="${target_sha#"${target_sha%%[![:space:]]*}"}"
          target_sha="${target_sha%"${target_sha##*[![:space:]]}"}"

          if [[ "$target_sha" =~ ^target_sha:[[:space:]]*([0-9a-fA-F]{40})$ ]]; then
            target_sha="${BASH_REMATCH[1]}"
          fi

          if [[ ! "$target_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo '::error title=Invalid target_sha::target_sha must be one 40-character Git commit SHA, optionally pasted as "target_sha: <sha>". Pass apply as its own boolean input.'
            exit 64
          fi

          target_sha="${target_sha,,}"
          printf 'target_sha=%s\n' "$target_sha" >> "$GITHUB_OUTPUT"

          if [ "$APPLY" = true ] || [ "$VERIFY_ONLY" = true ]; then
            current_main="$(
              curl --fail --silent --show-error \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" \
              | jq -r '.sha // empty'
            )"
            test -n "$current_main" || {
              echo '::error title=Main SHA unavailable::Could not resolve the current main commit before production apply.'
              exit 65
            }
            if [ "$target_sha" != "$current_main" ]; then
              echo "::error title=Stale target_sha::Production provider operation requires current main HEAD. target_sha=$target_sha current_main=$current_main"
              exit 66
            fi
          fi

      - name: Require main for trusted provider operation
        if: inputs.apply == true || inputs.verify_only == true
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main

      - name: Check out exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.target_sha }}

      - name: Verify exact target
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Show redacted non-destructive plan
        if: inputs.apply != true && inputs.verify_only != true
        run: node scripts/configure-supabase-auth-email.mjs

      - name: Verify live Auth email settings without mutation
        if: inputs.verify_only == true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'SUPABASE_ACCESS_TOKEN is not configured.' >&2; exit 1; }
          node scripts/configure-supabase-auth-email.mjs --verify-only

      - name: Require provider credentials before apply
        if: inputs.apply == true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.login }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'SUPABASE_ACCESS_TOKEN is not configured.' >&2; exit 1; }
          test -n "$RESEND_API_KEY" || { echo 'RESEND_API_KEY is not configured.' >&2; exit 1; }

      - name: Apply Resend SMTP to canonical Supabase Auth
        if: inputs.apply == true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.login }}
        run: node scripts/configure-supabase-auth-email.mjs --apply

      - name: Upload redacted provider receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-email-provider-${{ steps.target.outputs.target_sha }}
          path: artifacts/auth-email-provider-receipt.json
          if-no-files-found: warn
          retention-days: 14
