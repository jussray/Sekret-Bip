name: Cloudflare User Token Preflight

on:
  # A trusted operator explicitly initiates this read-only diagnostic on main.
  # Do not run Production-environment secrets from a feature-branch push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-token:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CF_APP_DOMAIN_TOKEN: ${{ secrets.CLOUDFLARE_APP_DOMAIN_API_TOKEN }}
      CF_ACCESS_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_BUILD_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_BUILDS_API_TOKEN }}
      CF_PAGES_READ_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_READ_API_TOKEN }}
      CF_APP_BINDING_READ_TOKEN: ${{ secrets.CLOUDFLARE_APP_BINDING_READ_API_TOKEN }}
    steps:
      - name: Verify Cloudflare credential transport and read authority
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const API = 'https://api.cloudflare.com/client/v4';
          const accountId = String(process.env.CF_ACCOUNT_ID || '').trim();
          const zoneId = String(process.env.CF_ZONE_ID || '').trim();
          if (!/^[0-9a-f]{32}$/.test(accountId)) throw new Error('ACCOUNT_ID_INVALID_FORMAT');
          if (!/^[0-9a-f]{32}$/.test(zoneId)) throw new Error('ZONE_ID_INVALID_FORMAT');

          const normalize = (value) => {
            const raw = String(value ?? '');
            if (!raw) return { token: '', changed: false, nonAsciiRemaining: false };
            let token = raw.trim().normalize('NFKC');
            let previous;
            do {
              previous = token;
              token = token.trim();
              token = token.replace(/^[A-Z_][A-Z0-9_]*[\p{White_Space}\p{Cf}]*=[\p{White_Space}\p{Cf}]*/u, '');
              const asciiQuoted = token.match(/^(["'])([\s\S]*)\1$/u);
              if (asciiQuoted) token = asciiQuoted[2].trim();
              const smartDoubleQuoted = token.match(/^“([\s\S]*)”$/u);
              if (smartDoubleQuoted) token = smartDoubleQuoted[1].trim();
              const smartSingleQuoted = token.match(/^‘([\s\S]*)’$/u);
              if (smartSingleQuoted) token = smartSingleQuoted[1].trim();
              token = token.replace(/^Bearer[\p{White_Space}\p{Cf}]+/iu, '');
            } while (token !== previous);
            token = token.replace(/[\p{White_Space}\p{Cf}]+/gu, '');
            return {
              token,
              changed: token !== raw,
              nonAsciiRemaining: /[^\x21-\x7e]/.test(token),
            };
          };

          const classify = (token) => {
            if (!token) return 'empty';
            if (/^[0-9a-f]{32}$/i.test(token)) return 'likely-token-id';
            if (token.startsWith('cfut_')) return 'user-prefixed';
            if (token.startsWith('cfat_')) return 'account-prefixed';
            if (token.startsWith('cfk_')) return 'key-prefixed';
            return 'opaque-ascii';
          };

          const verificationPathFor = (shape) => {
            if (shape === 'account-prefixed') return `/accounts/${accountId}/tokens/verify`;
            if (shape === 'user-prefixed' || shape === 'opaque-ascii') return '/user/tokens/verify';
            return null;
          };

          const candidates = [
            { source: 'CLOUDFLARE_APP_DOMAIN_API_TOKEN', raw: process.env.CF_APP_DOMAIN_TOKEN },
            { source: 'CLOUDFLARE_ACCESS_API_TOKEN', raw: process.env.CF_ACCESS_TOKEN },
            { source: 'CLOUDFLARE_API_TOKEN', raw: process.env.CF_API_TOKEN },
            { source: 'CLOUDFLARE_WORKERS_BUILDS_API_TOKEN', raw: process.env.CF_BUILD_TOKEN },
            { source: 'CLOUDFLARE_PAGES_READ_API_TOKEN', raw: process.env.CF_PAGES_READ_TOKEN },
            { source: 'CLOUDFLARE_APP_BINDING_READ_API_TOKEN', raw: process.env.CF_APP_BINDING_READ_TOKEN },
          ];
          // Each audit must have its OWN active scoped credential.
          // A broad token covering probes must never hide a missing dedicated slot.
          const scopedProbeRequirements = new Map([
            ['CLOUDFLARE_WORKERS_BUILDS_API_TOKEN', ['workers-scripts']],
            ['CLOUDFLARE_PAGES_READ_API_TOKEN', ['pages-project']],
            ['CLOUDFLARE_ACCESS_API_TOKEN', ['zone-access-apps']],
            ['CLOUDFLARE_APP_BINDING_READ_API_TOKEN', ['zone-identity','pages-domains','worker-domains','worker-routes']],
          ]);
          const missingAuditNames = [...scopedProbeRequirements.keys()]
            .filter((name) => !String(candidates.find((x) => x.source === name)?.raw || '').trim());
          if (missingAuditNames.length) {
            // Source names only, never token contents. Fail before any provider traffic.
            throw new Error('CLOUDFLARE_SCOPED_AUDIT_CREDENTIALS_MISSING: ' + missingAuditNames.join(','));
          }
          const auditedSources = new Map();

          const probes = [
            { name: 'zone-identity', path: `/zones/${zoneId}` },
            { name: 'pages-project', path: `/accounts/${accountId}/pages/projects/sekret-bip` },
            { name: 'workers-scripts', path: `/accounts/${accountId}/workers/scripts` },
            { name: 'pages-domains', path: `/accounts/${accountId}/pages/projects/sekret-bip/domains` },
            { name: 'worker-domains', path: `/accounts/${accountId}/workers/domains?hostname=app.sekretbip.net` },
            { name: 'worker-routes', path: `/zones/${zoneId}/workers/routes` },
            { name: 'account-access-apps', path: `/accounts/${accountId}/access/apps?per_page=1` },
            { name: 'zone-access-apps', path: `/zones/${zoneId}/access/apps?per_page=1` },
          ];
          const covered = new Set();

          const summarize = (body, status) => {
            const errors = Array.isArray(body?.errors) ? body.errors : [];
            const provider = errors
              .map((entry) => `${entry?.code ?? 'unknown'}:${entry?.message ?? 'provider error'}`)
              .join(';');
            return provider || `HTTP ${status}`;
          };

          const request = async (token, path) => {
            const response = await fetch(`${API}${path}`, {
              headers: { Accept: 'application/json', Authorization: `Bearer ${token}` },
            });
            const body = await response.json().catch(() => null);
            return { response, body };
          };

          for (const candidate of candidates) {
            const configured = Boolean(String(candidate.raw || ''));
            if (!configured) {
              console.log(`TOKEN_CANDIDATE source=${candidate.source} configured=false transport=missing`);
              continue;
            }

            const normalized = normalize(candidate.raw);
            const shape = classify(normalized.token);
            if (!normalized.token || normalized.nonAsciiRemaining) {
              console.log(`TOKEN_CANDIDATE source=${candidate.source} configured=true transport=invalid normalized=${normalized.changed} ascii=${!normalized.nonAsciiRemaining} shape=${shape}`);
              continue;
            }

            const verificationPath = verificationPathFor(shape);
            if (!verificationPath) {
              console.log(`TOKEN_CANDIDATE source=${candidate.source} configured=true transport=unsupported shape=${shape}`);
              continue;
            }

            console.log(`TOKEN_CANDIDATE source=${candidate.source} configured=true transport=valid normalized=${normalized.changed} ascii=true shape=${shape}`);
            const verify = await request(normalized.token, verificationPath);
            if (!verify.response.ok || verify.body?.success === false) {
              console.log(`TOKEN_VERIFY source=${candidate.source} result=failed shape=${shape} provider=${summarize(verify.body, verify.response.status)}`);
              continue;
            }
            const active = String(verify.body?.result?.status || '').toLowerCase() === 'active';
            if (!active) continue;
            console.log(`TOKEN_VERIFY source=${candidate.source} result=ok shape=${shape} status=active`);
            const passedProbes = new Set();
            for (const probe of probes) {
              const result = await request(normalized.token, probe.path);
              if (!result.response.ok || result.body?.success === false) {
                console.log(`READ_PROBE source=${candidate.source} probe=${probe.name} result=failed provider=${summarize(result.body, result.response.status)}`);
                continue;
              }
              covered.add(probe.name);
              passedProbes.add(probe.name);
              console.log(`READ_PROBE source=${candidate.source} probe=${probe.name} result=ok`);
            }
            const required = scopedProbeRequirements.get(candidate.source);
            if (required && required.every((name) => passedProbes.has(name))
                && (candidate.source !== 'CLOUDFLARE_WORKERS_BUILDS_API_TOKEN' || shape !== 'account-prefixed')) {
              auditedSources.set(candidate.source, true);
            }
          }

          const unverifiedAudits = [...scopedProbeRequirements.keys()]
            .filter((name) => !auditedSources.has(name));
          if (unverifiedAudits.length) {
            throw new Error('CLOUDFLARE_SCOPED_AUDIT_CREDENTIALS_UNVERIFIED: ' + unverifiedAudits.join(','));
          }
          const missing = probes.map((probe) => probe.name).filter((name) => !covered.has(name));
          if (missing.length) {
            throw new Error(`CLOUDFLARE_READ_AUTHORITY_INCOMPLETE missing=${missing.join(',')}`);
          }
          console.log('CLOUDFLARE_READ_AUTHORITY_READY');
          NODE
