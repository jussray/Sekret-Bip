name: Repository Truth Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-truth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}

jobs:
  repository-truth:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Record and verify exact head
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          printf 'event_name=%s\nexpected_head_sha=%s\nactual_head_sha=%s\ndiff_base_sha=%s\nworkflow_run_id=%s\n' \
            "$GITHUB_EVENT_NAME" "$EXPECTED_HEAD_SHA" "$ACTUAL_HEAD_SHA" "$DIFF_BASE_SHA" "$GITHUB_RUN_ID" \
            | tee artifacts/exact-head.txt
          test "$ACTUAL_HEAD_SHA" = "$EXPECTED_HEAD_SHA"

      - name: Fetch blobless remote branch history for inventory
        run: git fetch --filter=blob:none --no-tags origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Resolve verification base
        id: verification_base
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$DIFF_BASE_SHA"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          printf 'base_sha=%s\n' "$BASE_SHA" | tee -a artifacts/exact-head.txt
          printf 'base_sha=%s\n' "$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Use repository Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Parse-check repository truth auditors
        run: |
          node --check scripts/audit-failure-truth.mjs
          node --check scripts/verify-supabase-migration-lineage.mjs

      - name: Verify repository-truth gate contracts
        run: node --test test/repository-truth-gates.test.mjs test/resumable-production-verification.test.mjs test/supabase-migration-lineage.test.mjs test/supabase-production-receipt-authority.test.mjs test/production-authority-workflow-contracts.test.mjs test/cloudflare-branch-authority-workflow-contract.test.mjs test/consent-permanent-account-boundary.test.mjs

      - name: Audit failure truth on current change
        id: failure_truth
        continue-on-error: true
        run: node scripts/audit-failure-truth.mjs --strict --changed-since=${{ steps.verification_base.outputs.base_sha }} --report=artifacts/failure-truth-report.json

      - name: Audit branch hygiene
        id: branch_hygiene
        continue-on-error: true
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: node scripts/audit-branch-hygiene.mjs --report=artifacts/branch-hygiene-report.json

      - name: Verify implementation ledger
        id: implementation_ledger
        continue-on-error: true
        run: node scripts/verify-implementation-ledger.mjs --changed-since=${{ steps.verification_base.outputs.base_sha }}

      - name: Verify append-only Supabase migration lineage
        id: migration_lineage
        continue-on-error: true
        run: node scripts/verify-supabase-migration-lineage.mjs --base=${{ steps.verification_base.outputs.base_sha }} --head=${{ env.EXPECTED_HEAD_SHA }} --report=artifacts/supabase-migration-lineage.json

      - name: Record aggregate truth conclusion
        if: always()
        shell: bash
        env:
          FAILURE_TRUTH_OUTCOME: ${{ steps.failure_truth.outcome }}
          BRANCH_HYGIENE_OUTCOME: ${{ steps.branch_hygiene.outcome }}
          IMPLEMENTATION_LEDGER_OUTCOME: ${{ steps.implementation_ledger.outcome }}
          MIGRATION_LINEAGE_OUTCOME: ${{ steps.migration_lineage.outcome }}
        run: |
          set -euo pipefail
          printf '{\n  "schemaVersion": 2,\n  "eventName": "%s",\n  "exactHead": "%s",\n  "diffBase": "%s",\n  "failureTruth": "%s",\n  "branchHygiene": "%s",\n  "implementationLedger": "%s",\n  "supabaseMigrationLineage": "%s"\n}\n' \
            "$GITHUB_EVENT_NAME" \
            "$EXPECTED_HEAD_SHA" \
            "${{ steps.verification_base.outputs.base_sha }}" \
            "$FAILURE_TRUTH_OUTCOME" \
            "$BRANCH_HYGIENE_OUTCOME" \
            "$IMPLEMENTATION_LEDGER_OUTCOME" \
            "$MIGRATION_LINEAGE_OUTCOME" \
            | tee artifacts/repository-truth-conclusion.json

      - name: Upload repository-truth evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-truth-${{ env.EXPECTED_HEAD_SHA }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce repository-truth conclusion
        if: always()
        shell: bash
        env:
          FAILURE_TRUTH_OUTCOME: ${{ steps.failure_truth.outcome }}
          BRANCH_HYGIENE_OUTCOME: ${{ steps.branch_hygiene.outcome }}
          IMPLEMENTATION_LEDGER_OUTCOME: ${{ steps.implementation_ledger.outcome }}
          MIGRATION_LINEAGE_OUTCOME: ${{ steps.migration_lineage.outcome }}
        run: |
          set -euo pipefail
          test "$FAILURE_TRUTH_OUTCOME" = success
          test "$BRANCH_HYGIENE_OUTCOME" = success
          test "$IMPLEMENTATION_LEDGER_OUTCOME" = success
          test "$MIGRATION_LINEAGE_OUTCOME" = success
