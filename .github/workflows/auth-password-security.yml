name: Configure production Auth password security

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact main SHA whose password-security contract is being configured
        required: true
        type: string
      apply:
        description: Enable leaked-password protection on canonical Supabase Auth
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sekret-auth-password-security-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SUPABASE_PROJECT_REF: tbsevonvegdnlyjgplmm

jobs:
  reconcile-auth-password-security:
    name: Plan or apply production Auth password security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Normalize and validate dispatch contract
        id: target
        shell: bash
        env:
          TARGET_SHA_INPUT: ${{ inputs.target_sha }}
          APPLY: ${{ inputs.apply }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          target_sha="$TARGET_SHA_INPUT"
          target_sha="${target_sha#"${target_sha%%[![:space:]]*}"}"
          target_sha="${target_sha%"${target_sha##*[![:space:]]}"}"

          if [[ "$target_sha" =~ ^target_sha:[[:space:]]*([0-9a-fA-F]{40})$ ]]; then
            target_sha="${BASH_REMATCH[1]}"
          fi

          if [[ ! "$target_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo '::error title=Invalid target_sha::target_sha must be one 40-character Git commit SHA, optionally pasted as "target_sha: <sha>". Pass apply as its own boolean input.'
            exit 64
          fi

          target_sha="${target_sha,,}"
          printf 'target_sha=%s\n' "$target_sha" >> "$GITHUB_OUTPUT"

          if [ "$APPLY" = true ]; then
            current_main="$(
              curl --fail --silent --show-error \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" \
              | jq -r '.sha // empty'
            )"
            test -n "$current_main" || {
              echo '::error title=Main SHA unavailable::Could not resolve the current main commit before production apply.'
              exit 65
            }
            if [ "$target_sha" != "$current_main" ]; then
              echo "::error title=Stale target_sha::Production apply requires current main HEAD. target_sha=$target_sha current_main=$current_main"
              exit 66
            fi
          fi

      - name: Require main for production apply
        if: inputs.apply == true
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main

      - name: Check out exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.target_sha }}

      - name: Verify exact target
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Show redacted non-destructive plan
        run: node scripts/configure-supabase-password-security.mjs

      - name: Require provider credentials before apply
        if: inputs.apply == true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'SUPABASE_ACCESS_TOKEN is not configured.' >&2; exit 1; }

      - name: Apply leaked-password protection to canonical Supabase Auth
        if: inputs.apply == true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/configure-supabase-password-security.mjs --apply

      - name: Upload redacted password-security receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-password-security-${{ steps.target.outputs.target_sha }}
          path: artifacts/auth-password-security-receipt.json
          if-no-files-found: warn
          retention-days: 14
