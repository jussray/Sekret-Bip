name: Reconcile app.sekretbip.net Frontend Ownership

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-cloudflare-app-domain.yml'
      - 'scripts/reconcile-cloudflare-app-domain.mjs'
      - 'scripts/run-cloudflare-app-domain-reconcile-with-receipt.mjs'
      - 'scripts/run-with-normalized-cloudflare-token.mjs'
      - 'test/cloudflare-app-domain-reconciler.test.mjs'
      - 'test/cloudflare-app-domain-failure-receipt.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-cloudflare-app-domain.yml'
      - 'scripts/reconcile-cloudflare-app-domain.mjs'
      - 'scripts/run-cloudflare-app-domain-reconcile-with-receipt.mjs'
      - 'scripts/run-with-normalized-cloudflare-token.mjs'
      - 'test/cloudflare-app-domain-reconciler.test.mjs'
      - 'test/cloudflare-app-domain-failure-receipt.test.mjs'
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact approved current-main SHA allowed to own the provider mutation
        required: true
        type: string
      apply:
        description: Apply the approved exact-host Worker routing repair to app.sekretbip.net
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloudflare-app-domain-routing-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BIP_APP_ZONE: sekretbip.net
  BIP_APP_HOSTNAME: app.sekretbip.net
  BIP_APP_PAGES_PROJECT: sekret-bip
  BIP_APP_BACKEND_WORKER: sekret-backend
  BIP_APP_URL: https://app.sekretbip.net
  BIP_API_HEALTH_URL: https://api.sekretbip.net/health

jobs:
  reconcile:
    name: Restore Pages ownership of app.sekretbip.net
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Verify focused route reconciler contract
        run: node --test test/cloudflare-app-domain-reconciler.test.mjs test/cloudflare-app-domain-failure-receipt.test.mjs

      - name: Show non-destructive plan
        run: node scripts/reconcile-cloudflare-app-domain.mjs

      - name: Require exact approved current main before provider secret use
        if: github.event_name == 'workflow_dispatch' && inputs.apply == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'target_sha must be a lowercase 40-character commit SHA.' >&2
            exit 1
          }
          actual="$(git rev-parse HEAD)"
          current_main="$({
            curl --fail-with-body --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPOSITORY/commits/main"
          } | node -e "let body='';process.stdin.on('data',c=>body+=c);process.stdin.on('end',()=>{const parsed=JSON.parse(body);if(!parsed.sha)process.exit(2);process.stdout.write(parsed.sha);});")"
          printf 'approved=%s\nactual=%s\ncurrent_main=%s\n' "$TARGET_SHA" "$actual" "$current_main"
          test "$actual" = "$TARGET_SHA" || {
            echo 'Refusing Cloudflare route mutation because checkout is not the approved target SHA.' >&2
            exit 1
          }
          test "$TARGET_SHA" = "$current_main" || {
            echo 'Refusing Cloudflare route mutation because approved target is no longer current main.' >&2
            exit 1
          }

      - name: Require Cloudflare credentials before approved apply
        if: github.event_name == 'workflow_dispatch' && inputs.apply == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo 'CLOUDFLARE_API_TOKEN is not configured.' >&2
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo 'CLOUDFLARE_ACCOUNT_ID is not configured.' >&2
            exit 1
          }

      - name: Re-verify exact approved main immediately before provider mutation
        if: github.event_name == 'workflow_dispatch' && inputs.apply == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          current_main="$({
            curl --fail-with-body --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPOSITORY/commits/main"
          } | node -e "let body='';process.stdin.on('data',c=>body+=c);process.stdin.on('end',()=>{const parsed=JSON.parse(body);if(!parsed.sha)process.exit(2);process.stdout.write(parsed.sha);});")"
          printf 'mutation_target=%s\ncurrent_main=%s\n' "$TARGET_SHA" "$current_main"
          test "$TARGET_SHA" = "$current_main" || {
            echo 'Main advanced after provider preflight; refusing stale Cloudflare mutation authority.' >&2
            exit 1
          }

      - name: Reconcile live app hostname ownership
        if: github.event_name == 'workflow_dispatch' && inputs.apply == true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          if node --input-type=module -e "import { normalizeCloudflareTokenTransport } from './scripts/run-with-normalized-cloudflare-token.mjs'; const result = normalizeCloudflareTokenTransport(process.env.CLOUDFLARE_API_TOKEN); process.exit(result.token && !result.nonAsciiRemaining ? 0 : 1);"; then
            node scripts/run-with-normalized-cloudflare-token.mjs \
              scripts/run-cloudflare-app-domain-reconcile-with-receipt.mjs \
              --apply
          else
            echo 'CLOUDFLARE_APP_DOMAIN_TOKEN_TRANSPORT_INVALID_RETAINING_RECEIPT'
            CLOUDFLARE_API_TOKEN='' \
              node scripts/run-cloudflare-app-domain-reconcile-with-receipt.mjs --apply
            exit 1
          fi

      - name: Upload Cloudflare route evidence
        if: github.event_name == 'workflow_dispatch' && inputs.apply == true && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloudflare-app-domain-routing-evidence-${{ github.run_id }}
          path: artifacts/cloudflare-app-domain-routing-evidence.json
          if-no-files-found: error
          retention-days: 30
