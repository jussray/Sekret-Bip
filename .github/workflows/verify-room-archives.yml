name: Verify Room Archives

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-archives:
    name: Archive Integrity Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Hydrate LFS assets
        run: git lfs pull

      - name: Confirm live files are real PNGs
        run: |
          echo "── Live bg-*.png sizes ──"
          ls -lh assets/images/bg-*.png
          STUBS=$(find assets/images -maxdepth 1 -name 'bg-*.png' -size -1k | wc -l)
          if [ "$STUBS" -gt 0 ]; then
            echo "❌ $STUBS live file(s) are under 1 KB — LFS pull may have failed."
            exit 1
          fi
          echo "✅ All live files are real PNGs."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify archive files match live files
        run: node scripts/verify-room-archives.js --strict-match

      - name: Report repair boundary
        run: |
          echo "Archive repair is verification-only in Actions budget mode."
          echo "If this job fails, repair the files in a normal PR and preserve the evidence there."
