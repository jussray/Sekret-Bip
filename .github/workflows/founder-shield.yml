name: Founder Shield

on:
  pull_request:
    paths:
      - security/firewall-v10.policy.json
      - scripts/verify-firewall-v10.mjs
      - scripts/codeql-pr-alert-proof.mjs
      - worker/auth.ts
      - worker/voice-entry.ts
      - public/_headers
      - test/worker-auth.test.mjs
      - test/front-door-security-telemetry.test.mjs
      - test/cloudflare-worker-consolidation.test.mjs
      - test/founder-shield-public-edge-contract.test.mjs
      - wrangler.toml
      - .dev.vars.example
      - .github/workflows/codeql-pr-alert-proof.yml
      - .github/workflows/product-design-playwright-proof.yml
      - .github/workflows/founder-shield.yml
  push:
    branches:
      - main
    paths:
      - security/firewall-v10.policy.json
      - scripts/verify-firewall-v10.mjs
      - scripts/codeql-pr-alert-proof.mjs
      - worker/auth.ts
      - worker/voice-entry.ts
      - public/_headers
      - test/worker-auth.test.mjs
      - test/front-door-security-telemetry.test.mjs
      - test/cloudflare-worker-consolidation.test.mjs
      - test/founder-shield-public-edge-contract.test.mjs
      - wrangler.toml
      - .dev.vars.example
      - .github/workflows/codeql-pr-alert-proof.yml
      - .github/workflows/product-design-playwright-proof.yml
      - .github/workflows/founder-shield.yml

permissions:
  contents: read

concurrency:
  group: founder-shield-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify-founder-shield:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Record and verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'event=%s\nexpected=%s\nactual=%s\n' "$GITHUB_EVENT_NAME" "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Verify policy against runtime authority
        run: node scripts/verify-firewall-v10.mjs

      - name: Verify auth, CORS, headers, rate-limit, and denial telemetry contracts
        run: node --test test/worker-auth.test.mjs test/front-door-security-telemetry.test.mjs

      - name: Verify Worker authority contract
        run: node --test test/cloudflare-worker-consolidation.test.mjs

      - name: Verify anonymous public-edge proof contract
        run: node --test test/founder-shield-public-edge-contract.test.mjs

  verify-live-edge:
    name: Verify anonymous live edge on main
    if: github.event_name == 'push'
    needs: verify-founder-shield
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    environment: Production
    steps:
      - name: Capture anonymous live public edge evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/founder-shield-live

          pages_headers="$RUNNER_TEMP/founder-shield-sekretbip.headers"
          release_headers="$RUNNER_TEMP/founder-shield-release.headers"
          release_body="$RUNNER_TEMP/founder-shield-release.json"
          api_root_headers="$RUNNER_TEMP/founder-shield-api-root.headers"
          api_options_headers="$RUNNER_TEMP/founder-shield-api-options.headers"

          pages_result="$(curl --silent --show-error --location --max-time 20 \
            --dump-header "$pages_headers" \
            --output /dev/null \
            --write-out '%{http_code} %{url_effective}' \
            https://sekretbip.net/)"
          read -r pages_status pages_url <<<"$pages_result"

          release_status="000"
          release_url="https://sekretbip.net/.well-known/sekret-release.json"
          release_json=""
          observed_release_sha=""
          for release_attempt in $(seq 1 16); do
            : > "$release_headers"
            : > "$release_body"
            release_result=""
            if release_result="$(curl --silent --show-error --location --max-time 5 \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              --dump-header "$release_headers" \
              --output "$release_body" \
              --write-out '%{http_code} %{url_effective}' \
              "https://sekretbip.net/.well-known/sekret-release.json?founder_shield=$EXPECTED_HEAD_SHA&attempt=$release_attempt")"; then
              read -r release_status release_url <<<"$release_result"
              release_json="$(cat "$release_body")"
            else
              release_status="000"
              release_url="https://sekretbip.net/.well-known/sekret-release.json"
              release_json=""
              printf 'release marker transport failure attempt=%s; retrying within bounded convergence window\n' "$release_attempt"
            fi
            observed_release_sha="$(
              node - "$release_json" <<'NODE'
          const [releaseJson] = process.argv.slice(2);
          try {
            const release = JSON.parse(releaseJson);
            process.stdout.write(typeof release?.commitSha === 'string' ? release.commitSha.toLowerCase() : '');
          } catch {
            process.stdout.write('');
          }
          NODE
            )"
            if [[ "$release_status" == "200" && "$observed_release_sha" == "${EXPECTED_HEAD_SHA,,}" ]]; then
              printf 'release marker converged attempt=%s sha=%s\n' "$release_attempt" "$observed_release_sha"
              break
            fi
            printf 'release marker pending attempt=%s status=%s observed=%s expected=%s\n' \
              "$release_attempt" "$release_status" "${observed_release_sha:-missing}" "${EXPECTED_HEAD_SHA,,}"
            if [[ "$release_attempt" -lt 16 ]]; then
              sleep 6
            fi
          done

          api_result="$(curl --silent --show-error --location --max-time 20 \
            --dump-header "$api_root_headers" \
            --output /dev/null \
            --write-out '%{http_code} %{url_effective}' \
            https://api.sekretbip.net/)"
          read -r api_status api_url <<<"$api_result"

          options_result="$(curl --silent --show-error --location --max-time 20 \
            --request OPTIONS \
            --header 'Origin: https://sekretbip.net' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: authorization,content-type' \
            --dump-header "$api_options_headers" \
            --output /dev/null \
            --write-out '%{http_code} %{url_effective}' \
            https://api.sekretbip.net/api/sekret/reply)"
          read -r options_status options_url <<<"$options_result"

          sanitize_headers() {
            local source="$1"
            local destination="$2"
            awk '
              {
                line = $0
                lower = tolower(line)
                if (lower ~ /^(set-cookie|cookie|authorization|proxy-authorization|cf-authorization|cf-access-token|cf-access-client-id|cf-access-client-secret):/) {
                  sub(/:.*/, ": [REDACTED]", line)
                }
                print line
              }
            ' "$source" > "$destination"
          }

          sanitize_headers "$pages_headers" artifacts/founder-shield-live/sekretbip.headers
          sanitize_headers "$release_headers" artifacts/founder-shield-live/release.headers
          sanitize_headers "$api_root_headers" artifacts/founder-shield-live/api-root.headers
          sanitize_headers "$api_options_headers" artifacts/founder-shield-live/api-options.headers

          release_json="$(cat "$release_body")"
          node - \
            "$pages_url" \
            "$release_url" \
            "$api_url" \
            "$options_url" \
            "$release_json" \
            "$EXPECTED_HEAD_SHA" <<'NODE'
          const [pagesUrl, releaseUrl, apiUrl, optionsUrl, releaseJson, expectedHeadSha] = process.argv.slice(2);

          function assertPublicUrl(rawUrl, expectedHost, label) {
            const url = new URL(rawUrl);
            const host = url.hostname.toLowerCase();
            const path = url.pathname.toLowerCase();
            if (
              host === 'cloudflareaccess.com' ||
              host.endsWith('.cloudflareaccess.com') ||
              path.startsWith('/cdn-cgi/access/')
            ) {
              throw new Error(`${label} entered Cloudflare Access instead of the anonymous production edge: ${url}`);
            }
            if (host !== expectedHost) {
              throw new Error(`${label} ended on unexpected host ${host}; expected ${expectedHost}`);
            }
          }

          assertPublicUrl(pagesUrl, 'sekretbip.net', 'Pages front door');
          assertPublicUrl(releaseUrl, 'sekretbip.net', 'Pages release marker');
          assertPublicUrl(apiUrl, 'api.sekretbip.net', 'API root');
          assertPublicUrl(optionsUrl, 'api.sekretbip.net', 'API CORS preflight');

          let release;
          try {
            release = JSON.parse(releaseJson);
          } catch (error) {
            throw new Error(`public release marker was not valid JSON: ${error.message}`);
          }

          const expected = expectedHeadSha.toLowerCase();
          const required = {
            schemaVersion: 2,
            app: 'sekret-bip',
            surface: 'web-front-door',
            environment: 'production',
            commitSha: expected,
            branch: 'main',
            deploymentProvider: 'cloudflare-pages',
            canonicalUrl: 'https://sekretbip.net',
          };
          for (const [key, value] of Object.entries(required)) {
            if (release?.[key] !== value) {
              throw new Error(`release marker ${key} mismatch: expected ${JSON.stringify(value)}, observed ${JSON.stringify(release?.[key])}`);
            }
          }
          NODE

          cp "$release_body" artifacts/founder-shield-live/sekret-release.json

          printf 'pages_status=%s\nrelease_status=%s\napi_root_status=%s\napi_options_status=%s\n' \
            "$pages_status" "$release_status" "$api_status" "$options_status" \
            | tee artifacts/founder-shield-live/status.txt
          printf 'pages_url=%s\nrelease_url=%s\napi_root_url=%s\napi_options_url=%s\n' \
            "$pages_url" "$release_url" "$api_url" "$options_url" \
            | tee artifacts/founder-shield-live/effective-urls.txt

          test "$pages_status" -ge 200
          test "$pages_status" -lt 400
          test "$release_status" -eq 200
          test "$api_status" -ne 000
          test "$api_status" -lt 500
          test "$options_status" -ne 000
          test "$options_status" -lt 500

      - name: Upload live edge evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: founder-shield-live-${{ env.EXPECTED_HEAD_SHA }}
          path: artifacts/founder-shield-live
          if-no-files-found: ignore
          retention-days: 30
