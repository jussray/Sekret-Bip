name: Cloudflare Build Cost Guard Apply

on:
  push:
    branches:
      - fix/cloudflare-build-cost-guard
    paths:
      - .github/workflows/cloudflare-build-cost-guard-apply.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-build-cost-guard-apply
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply-cost-guard:
    name: Apply and verify Worker build watch-path cost guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_BUILD_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_BUILDS_API_TOKEN }}
      CF_FALLBACK_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_WORKER_NAME: sekret-backend
    steps:
      - name: Require bounded provider authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_ACCOUNT_ID:-}" || {
            echo 'CLOUDFLARE_ACCOUNT_ID is not configured.' >&2
            exit 1
          }
          if [ -z "${CF_BUILD_TOKEN:-}" ] && [ -z "${CF_FALLBACK_TOKEN:-}" ]; then
            echo 'A Cloudflare Workers Builds-capable token is required.' >&2
            exit 1
          fi

      - name: Patch only production build watch paths and verify readback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const API = 'https://api.cloudflare.com/client/v4';
          const accountId = (process.env.CF_ACCOUNT_ID || '').trim();
          const workerName = (process.env.CF_WORKER_NAME || '').trim();
          const desiredPathIncludes = ['*'];
          const desiredPathExcludes = [
            '.agents/**',
            '.ai-skills/**',
            '.control-room/**',
            '.github/**',
            'artifacts/**',
            'control-room/**',
            'docs/**',
            'e2e/**',
            'screenshots/**',
            'test/**',
            '*.md',
          ];

          function cleanList(value) {
            return [...new Set((Array.isArray(value) ? value : [])
              .map((item) => String(item || '').trim())
              .filter(Boolean))];
          }

          function sameSet(left, right) {
            const a = [...cleanList(left)].sort();
            const b = [...cleanList(right)].sort();
            return a.length === b.length && a.every((value, index) => value === b[index]);
          }

          function errorSummary(payload, status) {
            const errors = Array.isArray(payload?.errors) ? payload.errors : [];
            const compact = errors
              .map((entry) => `${entry?.code ?? 'unknown'}:${entry?.message ?? 'provider error'}`)
              .join('; ');
            return compact || `HTTP ${status}`;
          }

          async function cf(token, path, options = {}) {
            const response = await fetch(`${API}${path}`, {
              method: options.method || 'GET',
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
              },
              body: options.body === undefined ? undefined : JSON.stringify(options.body),
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.success === false) {
              throw new Error(errorSummary(payload, response.status));
            }
            return payload?.result;
          }

          function selectProductionTrigger(triggers) {
            const active = (Array.isArray(triggers) ? triggers : []).filter((trigger) => !trigger?.deleted_on);
            const production = active.filter((trigger) => {
              const includes = cleanList(trigger?.branch_includes);
              const excludes = cleanList(trigger?.branch_excludes);
              return includes.includes('main') && !excludes.includes('main') && !excludes.includes('*');
            });
            if (production.length !== 1) {
              throw new Error(`Expected one active main production trigger, found ${production.length}.`);
            }
            return {
              production: production[0],
              otherActive: active.filter((trigger) => trigger?.trigger_uuid !== production[0]?.trigger_uuid),
            };
          }

          async function inspect(token) {
            const scripts = await cf(token, `/accounts/${accountId}/workers/scripts?per_page=100`);
            const workers = (Array.isArray(scripts) ? scripts : []).filter((script) => script?.id === workerName);
            if (workers.length !== 1 || !workers[0]?.tag) {
              throw new Error(`Expected one ${workerName} Worker with an immutable script tag.`);
            }
            const triggers = await cf(token, `/accounts/${accountId}/builds/workers/${workers[0].tag}/triggers`);
            return {
              workerTag: workers[0].tag,
              ...selectProductionTrigger(triggers),
            };
          }

          const tokens = [...new Set([
            process.env.CF_BUILD_TOKEN,
            process.env.CF_FALLBACK_TOKEN,
          ].map((value) => String(value || '').trim()).filter(Boolean))];

          let selectedToken = null;
          let beforeInspection = null;
          const failures = [];
          for (const token of tokens) {
            try {
              beforeInspection = await inspect(token);
              selectedToken = token;
              break;
            } catch (error) {
              failures.push(error instanceof Error ? error.message : String(error));
            }
          }

          if (!selectedToken || !beforeInspection) {
            throw new Error(`No configured token could read Workers Builds state: ${failures.join(' | ')}`);
          }

          const trigger = beforeInspection.production;
          const triggerUuid = String(trigger?.trigger_uuid || '').trim();
          if (!triggerUuid) throw new Error('Production trigger UUID is missing from provider readback.');

          const before = {
            pathIncludes: cleanList(trigger?.path_includes),
            pathExcludes: cleanList(trigger?.path_excludes),
          };
          const changeRequired = !sameSet(before.pathIncludes, desiredPathIncludes)
            || !sameSet(before.pathExcludes, desiredPathExcludes);
          let mutationStarted = false;

          try {
            if (changeRequired) {
              mutationStarted = true;
              await cf(selectedToken, `/accounts/${accountId}/builds/triggers/${triggerUuid}`, {
                method: 'PATCH',
                body: {
                  path_includes: desiredPathIncludes,
                  path_excludes: desiredPathExcludes,
                },
              });
            }

            const afterInspection = await inspect(selectedToken);
            const after = {
              pathIncludes: cleanList(afterInspection.production?.path_includes),
              pathExcludes: cleanList(afterInspection.production?.path_excludes),
            };
            if (!sameSet(after.pathIncludes, desiredPathIncludes)
              || !sameSet(after.pathExcludes, desiredPathExcludes)) {
              throw new Error('Cloudflare watch-path readback did not match the approved cost guard.');
            }

            const receipt = {
              schema: 'sekret-bip/cloudflare-build-cost-guard@v1',
              generatedAt: new Date().toISOString(),
              worker: workerName,
              branchPolicy: 'main production trigger only',
              before,
              desired: {
                pathIncludes: desiredPathIncludes,
                pathExcludes: desiredPathExcludes,
              },
              after,
              applied: changeRequired,
              verified: true,
              nonProductionTriggerObserved: afterInspection.otherActive.length > 0,
              buildRequested: false,
              deploymentRequested: false,
            };
            fs.writeFileSync('artifacts/cloudflare-build-cost-guard.json', `${JSON.stringify(receipt, null, 2)}\n`);
            console.log(`COST_GUARD_VERIFIED applied=${changeRequired} preview_trigger_observed=${receipt.nonProductionTriggerObserved}`);
          } catch (error) {
            if (mutationStarted) {
              try {
                await cf(selectedToken, `/accounts/${accountId}/builds/triggers/${triggerUuid}`, {
                  method: 'PATCH',
                  body: {
                    path_includes: before.pathIncludes,
                    path_excludes: before.pathExcludes,
                  },
                });
                console.error('COST_GUARD_ROLLBACK_SUCCEEDED');
              } catch {
                console.error('COST_GUARD_ROLLBACK_FAILED');
              }
            }
            throw error;
          }
          NODE

      - name: Summarize bounded provider mutation
        if: success()
        shell: bash
        run: |
          {
            echo '## Cloudflare build cost guard'
            echo
            echo '- Worker: `sekret-backend`'
            echo '- Scope: production Workers Builds watch paths only'
            echo '- Runtime deployment: not requested'
            echo '- Build request: not requested'
            echo '- Readback: verified'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized cost-guard receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloudflare-build-cost-guard-${{ github.run_id }}
          path: artifacts/cloudflare-build-cost-guard.json
          if-no-files-found: warn
          retention-days: 30

  browser-proof:
    name: Prove public production path remains healthy
    needs: apply-cost-guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact repair commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run anonymous production Playwright proof
        env:
          CI: 'true'
        run: npx playwright test e2e/production-public-front-door.spec.ts --config=playwright.production.config.ts --project=chromium

      - name: Upload browser proof artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloudflare-build-cost-guard-browser-${{ github.run_id }}
          path: |
            playwright-report-production
            test-results
          if-no-files-found: warn
          retention-days: 30
