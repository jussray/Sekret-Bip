name: EAS Build

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact verified commit SHA to build
        required: true
        type: string
      app:
        description: App target to build
        required: true
        default: teen
        type: choice
        options:
          - teen
          - parent
      platform:
        description: Platform to build
        required: true
        default: ios
        type: choice
        options:
          - ios
          - android
      channel:
        description: Build channel
        required: true
        default: preview
        type: choice
        options:
          - development
          - preview
          - production

concurrency:
  group: eas-build-${{ inputs.target_sha }}-${{ inputs.app }}-${{ inputs.platform }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ inputs.target_sha }}

jobs:
  build:
    name: Build ${{ inputs.app }} ${{ inputs.platform }} @ ${{ inputs.target_sha }}
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APP_VARIANT: ${{ inputs.app }}
      EXPO_PUBLIC_APP_VARIANT: ${{ inputs.app }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      # Prefer the current Supabase publishable-key contract. The legacy anon
      # secret remains a bounded fallback so existing environments do not break
      # before their GitHub secret is migrated.
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Check out exact verified candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'target_sha must be a lowercase 40-character commit SHA.' >&2
            exit 1
          }
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Resolve EAS profile
        id: profile
        shell: bash
        run: |
          if [ "${{ inputs.app }}" = "parent" ]; then
            echo "name=parent-${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify required build secrets
        shell: bash
        run: |
          missing=0

          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing EXPO_TOKEN GitHub Actions secret."
            missing=1
          fi

          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ]; then
            echo "Missing EXPO_PUBLIC_SUPABASE_URL GitHub Actions secret."
            missing=1
          fi

          if [ -z "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Missing EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY GitHub Actions secret (legacy EXPO_PUBLIC_SUPABASE_ANON_KEY is accepted temporarily)."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "Add the missing values under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Sync Supabase variables to EAS environment
        shell: bash
        run: |
          npx eas-cli@latest env:create \
            --environment "${{ inputs.channel }}" \
            --name EXPO_PUBLIC_SUPABASE_URL \
            --value "$EXPO_PUBLIC_SUPABASE_URL" \
            --visibility plaintext \
            --scope project \
            --force \
            --non-interactive

          npx eas-cli@latest env:create \
            --environment "${{ inputs.channel }}" \
            --name EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --value "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            --visibility sensitive \
            --scope project \
            --force \
            --non-interactive

      - name: Queue EAS build from exact verified candidate
        run: npx eas-cli@latest build --profile "${{ steps.profile.outputs.name }}" --platform "${{ inputs.platform }}" --non-interactive --no-wait
