name: Trigger Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run focused trigger structural audit
        id: audit
        shell: bash
        run: |
          set +e
          node --test test/supabase-trigger-structure.test.mjs 2>&1 | tee trigger-audit.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload trigger audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trigger-audit-diagnostics
          path: trigger-audit.log
          retention-days: 7
          if-no-files-found: error
      - name: Enforce trigger audit result
        if: steps.audit.outputs.status != '0'
        run: exit 1
