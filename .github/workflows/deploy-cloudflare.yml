name: Verify Cloudflare Native Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current-main release commit to reconcile after a partial or interrupted deployment
        required: false
        type: string

concurrency:
  group: cloudflare-native-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEPLOYMENT_SHA: ${{ inputs.target_sha || github.sha }}

jobs:
  classify-production-impact:
    name: Classify exact main-push production impact
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      production_impact: ${{ steps.scope.outputs.production_impact }}
    steps:
      - name: Check out exact main push without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node for trusted scope classifier
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      # Fail-closed classifier invariants: changes to scripts/playwright-executable.mjs
      # or supabase/migrations/** are production-impacting and must run verification.
      - name: Classify merged diff fail closed
        id: scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          production_impact=true
          reason=classifier-failed-closed
          trusted_classifier="$RUNNER_TEMP/classify-production-impact.mjs"

          if [[ ! "$BEFORE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || [[ "$BEFORE_SHA" =~ ^0{40}$ ]]; then
            reason=missing-or-initial-before-sha
          elif ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            reason=before-sha-unavailable
          elif ! git cat-file -e "$CURRENT_SHA^{commit}" 2>/dev/null; then
            reason=current-sha-unavailable
          elif ! git show "$BEFORE_SHA:scripts/classify-production-impact.mjs" > "$trusted_classifier" 2>/dev/null; then
            reason=trusted-classifier-unavailable
          elif [[ ! -s "$trusted_classifier" ]]; then
            reason=trusted-classifier-empty
          else
            changed_paths="$(git diff --name-only --no-renames "$BEFORE_SHA" "$CURRENT_SHA")"
            printf '%s\n' "$changed_paths"
            classification="$(printf '%s\n' "$changed_paths" | node "$trusted_classifier")"
            case "$classification" in
              true|false)
                production_impact="$classification"
                reason=classified-by-previous-main
                ;;
              *)
                echo "Unexpected trusted production-impact classifier output: $classification" >&2
                exit 1
                ;;
            esac
          fi

          printf 'production_impact=%s\nreason=%s\n' "$production_impact" "$reason"
          printf 'production_impact=%s\n' "$production_impact" >> "$GITHUB_OUTPUT"

  verify-native-deployment:
    name: Verify exact frontend Worker, backend Worker, and release
    needs: classify-production-impact
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.classify-production-impact.result != 'success' || needs.classify-production-impact.outputs.production_impact != 'false') }}
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 180
    permissions:
      contents: read
      checks: read
      issues: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      CLOUDFLARE_CHECK_TIMEOUT_MS: '1800000'
      CLOUDFLARE_CHECK_POLL_MS: '10000'
      CLOUDFLARE_EVIDENCE_PATH: artifacts/cloudflare-native-deploy.json
      RELEASE_ENDPOINT_PROBE_PATH: artifacts/production-release-endpoint-probe.json
      PRODUCTION_BASE_URL: https://app.sekretbip.net
      FRONTEND_RELEASE_URL: https://app.sekretbip.net/.well-known/sekret-release.json
      BACKEND_HEALTH_URL: https://api.sekretbip.net/health
      SUPABASE_RUNTIME_HEALTH_URL: https://tbsevonvegdnlyjgplmm.supabase.co/functions/v1/runtime-contract-health
      SUPABASE_PROJECT_REF: tbsevonvegdnlyjgplmm
      SUPABASE_SCHEMA_EVIDENCE_PATH: artifacts/supabase-production-schema.json
      EXPECTED_RELEASE_SHA: ${{ inputs.target_sha || github.sha }}
      RELEASE_OBSERVATION_ISSUE: '696'
    steps:
      - name: Validate trusted release target before checkout
        id: trusted_target
        timeout-minutes: 5
        shell: bash
        env:
          TARGET_SHA: ${{ env.DEPLOYMENT_SHA }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          current_main="$({
            curl --fail-with-body --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPOSITORY/commits/main"
          } | node -e "let body='';process.stdin.on('data',c=>body+=c);process.stdin.on('end',()=>{const parsed=JSON.parse(body);if(!parsed.sha)process.exit(2);process.stdout.write(parsed.sha);});")"

          trusted_publisher="$RUNNER_TEMP/sekret-publish-production-release-observation.mjs"
          curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github.raw+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/contents/scripts/publish-production-release-observation.mjs?ref=$current_main" \
            --output "$trusted_publisher"
          test -s "$trusted_publisher"

          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo 'Deployment target must be a full 40-character commit SHA.' >&2
            exit 1
          }

          printf 'requested=%s\ncurrent_main=%s\n' "$TARGET_SHA" "$current_main"
          test "$TARGET_SHA" = "$current_main" || {
            echo 'Refusing to expose Production-scoped secrets to a target that is not current main.' >&2
            exit 1
          }

      - name: Check out release commit under verification
        id: checkout
        timeout-minutes: 5
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.DEPLOYMENT_SHA }}
          persist-credentials: false

      - name: Record and verify exact target head
        id: exact_head
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_RELEASE_SHA" "$actual"
          test "$actual" = "$EXPECTED_RELEASE_SHA"

      - name: Set up Node
        id: setup_node
        timeout-minutes: 5
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Install repository dependencies
        id: install
        timeout-minutes: 10
        run: npm ci

      - name: Revalidate current main before Production secret use
        id: trusted_current_main
        timeout-minutes: 5
        shell: bash
        env:
          TARGET_SHA: ${{ env.DEPLOYMENT_SHA }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main="$({
            curl --fail-with-body --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPOSITORY/commits/main"
          } | node -e "let body='';process.stdin.on('data',c=>body+=c);process.stdin.on('end',()=>{const parsed=JSON.parse(body);if(!parsed.sha)process.exit(2);process.stdout.write(parsed.sha);});")"
          printf 'requested=%s\ncurrent_main=%s\n' "$TARGET_SHA" "$current_main"
          test "$TARGET_SHA" = "$current_main" || {
            echo 'Production verification target is no longer current main; refusing secret-backed verification.' >&2
            exit 1
          }

      # Attack 2000 evidence rule: after exact-current-main trust is established,
      # independent proof planes keep observing even when a sibling plane fails or stalls.
      # A failed plane still fails the job; it no longer suppresses unrelated evidence.
      - name: Verify exact Supabase production schema contract
        id: supabase_schema
        if: ${{ !cancelled() && steps.trusted_current_main.outcome == 'success' }}
        timeout-minutes: 5
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/verify-supabase-production-schema.mjs

      - name: Record safe frontend and backend transport evidence
        id: release_transport
        if: ${{ !cancelled() && steps.trusted_current_main.outcome == 'success' }}
        timeout-minutes: 5
        run: node scripts/probe-production-release-endpoints.mjs

      - name: Verify backend health
        id: backend_health
        if: ${{ !cancelled() && steps.trusted_current_main.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          access_headers=()
          if [[ -n "${CLOUDFLARE_ACCESS_CLIENT_ID:-}" || -n "${CLOUDFLARE_ACCESS_CLIENT_SECRET:-}" ]]; then
            test -n "${CLOUDFLARE_ACCESS_CLIENT_ID:-}"
            test -n "${CLOUDFLARE_ACCESS_CLIENT_SECRET:-}"
            access_headers+=(
              -H "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID"
              -H "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET"
            )
          fi
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            "${access_headers[@]}" "$BACKEND_HEALTH_URL"

      - name: Verify Supabase runtime contracts
        id: supabase_health
        if: ${{ !cancelled() && steps.trusted_current_main.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$SUPABASE_RUNTIME_HEALTH_URL"

      - name: Install Chromium
        id: chromium
        if: ${{ !cancelled() && steps.trusted_current_main.outcome == 'success' }}
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium

      - name: Observe public production browser journeys independently
        id: production_browser_observation
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        timeout-minutes: 30
        run: >-
          npx playwright test
          --config=playwright.production.config.ts
          --grep-invert "production exposes the exact expected Pages and Worker release commit"

      - name: Wait for exact frontend and backend Worker checks plus release marker
        id: cloudflare_release
        if: ${{ !cancelled() && steps.trusted_current_main.outcome == 'success' && steps.release_transport.outcome == 'success' }}
        timeout-minutes: 35
        env:
          GITHUB_SHA: ${{ env.DEPLOYMENT_SHA }}
        run: node scripts/verify-cloudflare-native-deploy.mjs

      - name: Verify exact deployed release identity with Playwright
        id: production_playwright
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' && steps.cloudflare_release.outcome == 'success' }}
        timeout-minutes: 10
        run: >-
          npx playwright test
          --config=playwright.production.config.ts
          --grep "production exposes the exact expected Pages and Worker release commit"

      - name: Upload deployment evidence
        id: upload_evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloudflare-native-deployment-evidence-${{ env.DEPLOYMENT_SHA }}
          path: |
            artifacts/cloudflare-native-deploy.json
            artifacts/production-release-endpoint-probe.json
            artifacts/supabase-production-schema.json
            playwright-report-production/
            test-results-production/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish exact production release observation
        if: success()
        timeout-minutes: 5
        run: node scripts/publish-production-release-observation.mjs

      - name: Publish blocked exact production observation
        if: failure()
        timeout-minutes: 5
        env:
          RELEASE_OBSERVATION_MODE: blocked
          VERIFICATION_JOB_STATUS: failure
          RELEASE_STEP_OUTCOMES: >-
            {"trusted_target":"${{ steps.trusted_target.outcome }}","checkout":"${{ steps.checkout.outcome }}","exact_head":"${{ steps.exact_head.outcome }}","setup_node":"${{ steps.setup_node.outcome }}","install":"${{ steps.install.outcome }}","trusted_current_main":"${{ steps.trusted_current_main.outcome }}","cloudflare_release":"${{ steps.cloudflare_release.outcome }}","supabase_schema":"${{ steps.supabase_schema.outcome }}","release_transport":"${{ steps.release_transport.outcome }}","backend_health":"${{ steps.backend_health.outcome }}","supabase_health":"${{ steps.supabase_health.outcome }}","chromium":"${{ steps.chromium.outcome }}","production_browser_observation":"${{ steps.production_browser_observation.outcome }}","production_playwright":"${{ steps.production_playwright.outcome }}","upload_evidence":"${{ steps.upload_evidence.outcome }}"}
        run: node "$RUNNER_TEMP/sekret-publish-production-release-observation.mjs"
