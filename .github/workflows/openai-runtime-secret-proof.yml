name: OpenAI Runtime Secret Proof

on:
  push:
    branches: [main]
    paths:
      - 'wrangler.toml'
      - '.github/workflows/openai-runtime-secret-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bip-openai-runtime-secret-proof
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.sha }}
  RECEIPT_PATH: artifacts/openai-runtime-secret-proof.json

jobs:
  prove-openai-secret-presence:
    name: Prove OpenAI secret name on canonical Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_APP_BINDING_READ_API_TOKEN: ${{ secrets.CLOUDFLARE_APP_BINDING_READ_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci

      - name: Prove provider-held OpenAI secret presence
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || {
            echo '::error title=Missing Cloudflare account authority::CLOUDFLARE_ACCOUNT_ID is required for the canonical Worker readback.'
            exit 1
          }

          mkdir -p "$(dirname "$RECEIPT_PATH")"
          secret_names="$(mktemp)"
          read_error="$(mktemp)"
          canonical_error="$(mktemp)"
          trap 'rm -f "$secret_names" "$read_error" "$canonical_error"' EXIT

          credential_source=''

          # First attempt the existing least-privilege app-binding read credential.
          # Cloudflare currently permits Worker secret-name listing with Workers Scripts Read.
          if [ -n "${CLOUDFLARE_APP_BINDING_READ_API_TOKEN:-}" ]; then
            if CLOUDFLARE_API_TOKEN="$CLOUDFLARE_APP_BINDING_READ_API_TOKEN" \
              ./node_modules/.bin/wrangler secret list --config wrangler.toml > "$secret_names" 2> "$read_error"; then
              credential_source='app-binding-read'
            fi
          fi

          # Preserve the canonical credential as a fallback only. This keeps the proof
          # compatible with the existing deployment authority without requiring it when
          # the read-only credential has sufficient Workers Scripts Read scope.
          if [ -z "$credential_source" ] && [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            if CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN" \
              ./node_modules/.bin/wrangler secret list --config wrangler.toml > "$secret_names" 2> "$canonical_error"; then
              credential_source='canonical'
            fi
          fi

          if [ -z "$credential_source" ]; then
            echo '::error title=OpenAI runtime proof blocked::Neither the least-privilege Cloudflare read credential nor canonical credential could list Worker secret names.'
            exit 1
          fi

          if ! grep -q 'OPENAI_API_KEY' "$secret_names"; then
            echo '::error title=OpenAI runtime secret missing::OPENAI_API_KEY is not bound to the canonical sekret-backend Worker.'
            exit 1
          fi

          CREDENTIAL_SOURCE="$credential_source" OBSERVED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = {
            kind: 'sekret-bip/openai-runtime-secret-proof@v2',
            repository: 'jussray/Sekret-Bip',
            worker: 'sekret-backend',
            headSha: process.env.EXPECTED_HEAD_SHA,
            secretName: 'OPENAI_API_KEY',
            present: true,
            credentialSource: process.env.CREDENTIAL_SOURCE,
            secretValueRead: false,
            providerMutation: false,
            observedAt: process.env.OBSERVED_AT,
          };
          fs.writeFileSync(process.env.RECEIPT_PATH, `${JSON.stringify(receipt, null, 2)}\n`);
          NODE

          echo "OPENAI_API_KEY presence VERIFIED on canonical sekret-backend Worker via ${credential_source}; value was never read or printed."
          cat "$RECEIPT_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted proof receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bip-openai-runtime-secret-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RECEIPT_PATH }}
          if-no-files-found: warn
          retention-days: 30
