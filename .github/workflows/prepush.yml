name: Pre-Push Checks

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepush:
    name: Type-Check + Lint + Archive Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: true
          fetch-depth: 1
          persist-credentials: false

      - name: Hydrate LFS assets
        run: git lfs pull

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Audit runtime assets
        run: npm run audit:runtime-assets

      - name: Verify room archives
        run: |
          cp -f assets/images/bg-*.png assets/images/archive/
          npm run verify:room-archives
