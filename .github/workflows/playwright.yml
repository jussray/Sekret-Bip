name: Playwright Smoke and Guardrails

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current workflow head
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Run exact-release unit tests
        run: node --test test/cloudflare-native-deploy.test.mjs test/release-metadata.test.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke and guardrail tests
        run: npx playwright test

      - name: Verify founder-preview Comfort and Cloud routes
        run: npx playwright test --config=playwright.founder-preview.config.ts

      - name: Upload Playwright reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-founder-preview/
          if-no-files-found: ignore
          retention-days: 7
