name: Controlled Account Cloud Comfort Proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/controlled-account-cloud-comfort.yml'
      - 'playwright.controlled-account.config.ts'
      - 'scripts/playwright-executable.mjs'
      - 'e2e/controlled-account-cloud-comfort.spec.ts'
      - 'test/controlled-account-cloud-comfort-gate.test.mjs'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact deployed SHA to verify'
        required: true
        type: string
      target_url:
        description: 'Owned deployed origin: canonical production or sekret-bip Pages preview'
        required: true
        default: 'https://sekretbip.net'
        type: string
      confirm_controlled_account_use:
        description: 'Allow one login-only proof with the controlled permanent account'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: controlled-account-cloud-comfort-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha }}
  SEKRET_CONTROLLED_ACCOUNT_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.target_url || 'https://sekretbip.net' }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: Compile and lock controlled-account proof
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 1

      - name: Record and verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run controlled-account safety contract
        run: node --test test/controlled-account-cloud-comfort-gate.test.mjs

      - name: Run zero-error TypeScript
        run: npm run type-check

      - name: Compile and list controlled-account Playwright proof
        env:
          EXPECTED_HEAD_SHA: ${{ env.EXPECTED_HEAD_SHA }}
        run: npx playwright test --config=playwright.controlled-account.config.ts --list

  proof:
    if: github.event_name == 'workflow_dispatch'
    name: Exact-deployment authenticated auth boundary, Cloud and Comfort
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out exact requested head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 1

      - name: Record and verify exact requested head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Bind controlled-account target to an owned origin
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const raw = process.env.SEKRET_CONTROLLED_ACCOUNT_BASE_URL?.trim();
          if (!raw) throw new Error('Missing controlled-account target URL.');

          const url = new URL(raw);
          const cleanPath = url.pathname.replace(/\/+$/, '');
          if (url.protocol !== 'https:' || cleanPath !== '' || url.search || url.hash) {
            throw new Error(`Controlled-account target must be a bare HTTPS origin: ${raw}`);
          }

          const isProduction = url.origin === 'https://sekretbip.net';
          const isOwnedPreview = url.hostname.endsWith('.sekret-bip.pages.dev');
          if (!isProduction && !isOwnedPreview) {
            throw new Error(`Controlled-account target is not an owned Se'kret Bip origin: ${url.origin}`);
          }

          const kind = isProduction ? 'production' : 'preview';
          fs.appendFileSync(process.env.GITHUB_ENV, `CONTROLLED_TARGET_KIND=${kind}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `CONTROLLED_TARGET_ORIGIN=${url.origin}\n`);
          console.log(`Controlled-account target bound to ${kind} origin ${url.origin}.`);
          NODE

      - name: Require production target to equal current main
        if: env.CONTROLLED_TARGET_KIND == 'production'
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$current_main"
          printf 'requested=%s\ncurrent_main=%s\n' "$EXPECTED_HEAD_SHA" "$current_main"
          test "$current_main" = "$EXPECTED_HEAD_SHA"

      - name: Verify target origin serves the exact requested release
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const expected = process.env.EXPECTED_HEAD_SHA?.trim().toLowerCase();
          const origin = process.env.CONTROLLED_TARGET_ORIGIN;
          const kind = process.env.CONTROLLED_TARGET_KIND;
          if (!expected || !origin || !kind) throw new Error('Missing exact-deployment verification inputs.');

          const releaseUrl = `${origin}/.well-known/sekret-release.json`;
          const deadline = Date.now() + 240_000;
          let last = null;
          while (Date.now() < deadline) {
            try {
              const response = await fetch(`${releaseUrl}?controlledProof=${Date.now()}`, {
                cache: 'no-store',
                headers: { 'cache-control': 'no-cache, no-store, max-age=0' },
              });
              const body = response.ok ? await response.json() : null;
              last = {
                status: response.status,
                commitSha: body?.commitSha ?? null,
                environment: body?.environment ?? null,
                branch: body?.branch ?? null,
              };

              const exactSha = String(body?.commitSha ?? '').toLowerCase() === expected;
              const exactEnvironment = body?.environment === kind;
              const branchBoundary = kind === 'production'
                ? body?.branch === 'main'
                : Boolean(body?.branch && body.branch !== 'main');

              if (response.ok && exactSha && exactEnvironment && branchBoundary) {
                console.log(`Controlled target verified at exact ${kind} release ${expected}.`);
                process.exit(0);
              }
            } catch (error) {
              last = { error: error instanceof Error ? error.message : String(error) };
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error(`Controlled target did not reach exact ${kind} release ${expected}: ${JSON.stringify(last)}`);
          NODE

      - name: Require explicit controlled-account authority
        shell: bash
        env:
          CONFIRM_CONTROLLED_ACCOUNT_USE: ${{ inputs.confirm_controlled_account_use }}
          CONTROLLED_EMAIL: ${{ secrets.SEKRET_CONTROLLED_ACCOUNT_EMAIL }}
          CONTROLLED_PASSWORD: ${{ secrets.SEKRET_CONTROLLED_ACCOUNT_PASSWORD }}
        run: |
          set -euo pipefail
          test "$CONFIRM_CONTROLLED_ACCOUNT_USE" = 'true' || {
            echo '::error::Controlled account proof requires confirm_controlled_account_use=true.'
            exit 1
          }
          test -n "$CONTROLLED_EMAIL" || {
            echo '::error::Missing SEKRET_CONTROLLED_ACCOUNT_EMAIL repository secret.'
            exit 1
          }
          test -n "$CONTROLLED_PASSWORD" || {
            echo '::error::Missing SEKRET_CONTROLLED_ACCOUNT_PASSWORD repository secret.'
            exit 1
          }
          echo 'Controlled account authority and masked credentials are present.'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prove auth-failure boundary, Cloud and Comfort without private content
        env:
          SEKRET_CONTROLLED_ACCOUNT_EMAIL: ${{ secrets.SEKRET_CONTROLLED_ACCOUNT_EMAIL }}
          SEKRET_CONTROLLED_ACCOUNT_PASSWORD: ${{ secrets.SEKRET_CONTROLLED_ACCOUNT_PASSWORD }}
        run: npx playwright test --config=playwright.controlled-account.config.ts

      - name: Upload sanitized controlled-account receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-account-cloud-comfort-${{ env.EXPECTED_HEAD_SHA }}
          path: artifacts/controlled-account-cloud-comfort.json
          if-no-files-found: warn
          retention-days: 14
