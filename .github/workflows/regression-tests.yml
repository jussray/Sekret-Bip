name: Regression Tests

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: regression-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type check and regression suites
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Core test suite
        run: npm test

      - name: Oracle discovery tests
        run: npm run test:oracle

      - name: Voice intelligence tests
        run: npm run test:voice-intelligence

      - name: Device sync tests
        run: npm run test:device-sync
