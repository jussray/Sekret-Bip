name: Regression Tests

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: regression-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type check and regression suites
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bip_test
          POSTGRES_PASSWORD: bip_test_ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bip_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    timeout-minutes: 20

    env:
      SEKRET_TEST_PG_URL: postgres://postgres:bip_test_ephemeral@127.0.0.1:5432/bip_test # DevSkim: ignore DS162092 because this is an isolated disposable CI loopback database
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Verify disposable Postgres for guardian authorization suite
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql "$SEKRET_TEST_PG_URL" -v ON_ERROR_STOP=1 -c 'select current_database();'

      - name: Type check
        run: npm run type-check

      - name: Core test suite
        run: npm test

      - name: Oracle discovery tests
        run: npm run test:oracle

      - name: Voice intelligence tests
        run: npm run test:voice-intelligence

      - name: Device sync tests
        run: npm run test:device-sync
