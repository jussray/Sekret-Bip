# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
#
# This workflow file requires a free account on Bearer.com to manage findings, notifications and more.
# See https://docs.bearer.com/guides/bearer-cloud/
name: Bearer

on:
  push:
    branches: ["main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["main"]
  schedule:
    - cron: '29 10 * * 1'

permissions:
  contents: read # for actions/checkout to fetch code
  security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
  actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

jobs:
  bearer:
    runs-on: ubuntu-latest
    steps:
      # Checkout project source
      - uses: actions/checkout@v4
      # Install the exact official Bearer asset with SHA-256 integrity proof.
      # The third-party action's installer did not retry release-asset HTTP failures.
      - name: Install checksum-verified Bearer v2.1.3
        shell: bash
        run: |
          set -euo pipefail
          asset="bearer_2.1.3_linux_amd64.tar.gz"
          archive="$RUNNER_TEMP/$asset"
          curl --fail --silent --show-error --location \
            --retry 6 --retry-all-errors --retry-delay 3 \
            --connect-timeout 20 --max-time 180 \
            --output "$archive" \
            "https://github.com/Bearer/bearer/releases/download/v2.1.3/$asset"
          printf '%s  %s\\n' '974d4ad7bb71bc578675684d444e345e8fbad91c85557aac035406ef5cc04c68' "$archive" | sha256sum --check --status
          tar --no-same-owner -xzf "$archive" -C "$RUNNER_TEMP" bearer
          chmod 0755 "$RUNNER_TEMP/bearer"
      # Preserve Bearer's existing report format and exit-code setting.
      - name: Run Report
        id: report
        shell: bash
        env:
          BEARER_API_KEY: ${{ secrets.BEARER_TOKEN }}
          BEARER_FORMAT: sarif
          BEARER_OUTPUT: results.sarif
          BEARER_EXIT_CODE: '0'
          BEARER_HIDE_PROGRESS_BAR: 'true'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/bearer" scan .
          test -s results.sarif
      # Preserve the exact scanner output so merge-gate failures can be inspected
      # without weakening GitHub Advanced Security or rerunning against a different head.
      - name: Preserve Bearer SARIF evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bearer-sarif-${{ github.sha }}
          path: results.sarif
          if-no-files-found: error
          retention-days: 14
      # Upload SARIF file generated in previous step
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
