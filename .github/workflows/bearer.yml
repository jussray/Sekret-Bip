# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
#
# This workflow file requires a free account on Bearer.com to manage findings, notifications and more.
# See https://docs.bearer.com/guides/bearer-cloud/
name: Bearer

on:
  push:
    branches: ["main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["main"]
  schedule:
    - cron: '29 10 * * 1'

permissions:
  contents: read # for actions/checkout to fetch code
  security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
  actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

jobs:
  bearer:
    runs-on: ubuntu-latest
    steps:
      # Pin every scan to the exact PR head (or event commit outside PRs).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact scanned revision
        env:
          EXPECTED_SCANNED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SCANNED_SHA"
      # Use the published checksum-verified release instead of an unpinned
      # installer. Bounded retries tolerate transient release-download errors.
      - name: Install verified Bearer CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset='bearer_2.1.3_linux_amd64.tar.gz'
          archive="$RUNNER_TEMP/$asset"
          installed=0
          for attempt in 1 2 3; do
            if gh release download v2.1.3 --repo Bearer/bearer --pattern "$asset" --dir "$RUNNER_TEMP" --clobber; then
              installed=1
              break
            fi
            sleep $((attempt * 5))
          done
          test "$installed" -eq 1
          printf '%s  %s\n' '974d4ad7bb71bc578675684d444e345e8fbad91c85557aac035406ef5cc04c68' "$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/bearer-cli"
          tar --no-same-owner -xzf "$archive" -C "$RUNNER_TEMP/bearer-cli"
          test -x "$RUNNER_TEMP/bearer-cli/bearer"
          "$RUNNER_TEMP/bearer-cli/bearer" version
          echo "$RUNNER_TEMP/bearer-cli" >> "$GITHUB_PATH"
      - name: Run Report
        id: report
        env:
          BEARER_API_KEY: ${{ secrets.BEARER_TOKEN }}
        run: |
          set -euo pipefail
          bearer scan . --format sarif --output results.sarif --hide-progress-bar
      # Preserve the exact scanner output so merge-gate failures can be inspected
      # without weakening GitHub Advanced Security or rerunning against a different head.
      - name: Preserve Bearer SARIF evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bearer-sarif-${{ github.event.pull_request.head.sha || github.sha }}
          path: results.sarif
          if-no-files-found: error
          retention-days: 14
      # Upload SARIF file generated in previous step
      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
