name: Account Deletion Sweep

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Read-only Data API queue probe; disable only for an explicitly approved deletion run'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: account-deletion-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Process expired account deletion requests
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ACCOUNT_DELETION_PROCESS_SECRET: ${{ secrets.ACCOUNT_DELETION_PROCESS_SECRET }}
          SWEEP_CHECK_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only == true }}
        run: node scripts/sweep-account-deletions.mjs
