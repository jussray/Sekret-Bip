name: Firebase App Check Client Proof

on:
  push:
    branches:
      - feat/firebase-app-check-client
    paths:
      - package.json
      - package-lock.json
      - app.json
      - app/_layout.tsx
      - .env.example
      - src/services/appCheckToken.ts
      - src/services/firebase/appCheck.ts
      - src/utils/backendAuth.ts
      - scripts/verify-firebase-app-check-rollout.mjs
      - test/firebase-app-check-client-contract.test.mjs
      - test/firebase-client-app-check-contract.test.mjs
      - test/firebase-app-check-contract.test.mjs
      - e2e/smoke.spec.ts
      - .github/workflows/firebase-app-check-client-proof.yml
  workflow_dispatch:

concurrency:
  group: firebase-app-check-client-proof-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firebase-client-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assert exact branch head
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify App Check rollout state
        run: node scripts/verify-firebase-app-check-rollout.mjs

      - name: Run App Check contracts
        run: node --test test/firebase-app-check-client-contract.test.mjs test/firebase-client-app-check-contract.test.mjs test/firebase-app-check-contract.test.mjs

      - name: Typecheck
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Resolve Expo public config
        run: npx expo config --type public >/tmp/expo-public-config.txt

      - name: Export web bundle
        run: npm run build:web

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real web smoke path
        run: npm run test:e2e -- e2e/smoke.spec.ts
