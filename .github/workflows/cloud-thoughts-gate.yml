name: Cloud Thoughts Exact-Head Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - screens/CloudThoughtsScreen.tsx
      - app/(teen)/cloud.tsx
      - src/utils/api.ts
      - utils/api.ts
      - scripts/playwright-executable.mjs
      - test/cloud-thoughts-recovery-contract.test.mjs
      - test/canonical-comfort-cloud-routes.test.mjs
      - test/settings-companion-canon.test.mjs
      - e2e/cloud-thoughts-boundary.spec.ts
      - playwright.config.ts
      - package.json
      - package-lock.json
      - .github/workflows/cloud-thoughts-gate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-thoughts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  EXPO_NO_TELEMETRY: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify-cloud-thoughts:
    name: Canon, recovery, bundle, and authorization proof
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Each job gets its own disposable PostgreSQL instance, never a live data store.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bip_test
          POSTGRES_PASSWORD: bip_test_ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bip_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SEKRET_TEST_PG_URL: postgres://postgres:bip_test_ephemeral@127.0.0.1:5432/bip_test # DevSkim: ignore DS162092 because this endpoint is isolated to disposable CI loopback

    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 1

      - name: Record and verify exact head
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gate-evidence
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          printf 'expected_head_sha=%s\nactual_head_sha=%s\nworkflow_run_id=%s\n' \
            "$EXPECTED_HEAD_SHA" "$ACTUAL_HEAD_SHA" "$GITHUB_RUN_ID" \
            | tee gate-evidence/exact-head.txt
          test "$ACTUAL_HEAD_SHA" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run focused Cloud contracts
        shell: bash
        run: |
          set -o pipefail
          node --test \
            test/cloud-thoughts-recovery-contract.test.mjs \
            test/canonical-comfort-cloud-routes.test.mjs \
            test/settings-companion-canon.test.mjs \
            2>&1 | tee gate-evidence/cloud-contracts.log

      - name: Run zero-error TypeScript
        shell: bash
        run: |
          set -o pipefail
          npm run type-check 2>&1 | tee gate-evidence/typecheck.log

      - name: Run repository lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee gate-evidence/lint.log

      - name: Install mandatory real-test tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client ffmpeg
          psql "$SEKRET_TEST_PG_URL" -v ON_ERROR_STOP=1 -c 'select version();'
          psql "$SEKRET_TEST_PG_URL" -v ON_ERROR_STOP=1 -c "CREATE TABLE public.guardian_fixture_disposable_sentinel (marker text primary key); INSERT INTO public.guardian_fixture_disposable_sentinel (marker) VALUES ('guardian-consent-disposable-v1');"
          ffmpeg -version
          ffprobe -version

      - name: Run complete unit suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee gate-evidence/unit.log

      - name: Verify production web bundle
        shell: bash
        run: |
          set -o pipefail
          npm run build:web 2>&1 | tee gate-evidence/bundle.log

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prove unauthenticated Cloud route remains private
        shell: bash
        run: |
          set -o pipefail
          npx playwright test e2e/cloud-thoughts-boundary.spec.ts \
            --trace on 2>&1 | tee gate-evidence/playwright.log

      - name: Upload exact-head Cloud evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-thoughts-evidence-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            gate-evidence/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
