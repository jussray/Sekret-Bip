name: Verify Cloudflare Authority Source

on:
  push:
    paths:
      - 'scripts/verify-cloudflare-worker-branch-authority.mjs'
      - 'worker/companion-entry.ts'
      - 'worker/companion-internal-proof.ts'
      - 'test/bip-companion-internal-proof.test.mjs'
      - 'wrangler.bip.toml'
      - 'test/bip-companion-isolation.test.mjs'
      - 'scripts/run-with-normalized-cloudflare-token.mjs'
      - 'test/cloudflare-token-verification-fallback.test.mjs'
      - 'test/cloudflare-branch-authority-workflow-contract.test.mjs'
      - 'test/cloudflare-branch-authority-apply-workflow-contract.test.mjs'
      - '.github/workflows/verify-cloudflare-authority-source.yml'
  pull_request:
    paths:
      - 'scripts/verify-cloudflare-worker-branch-authority.mjs'
      - 'worker/companion-entry.ts'
      - 'worker/companion-internal-proof.ts'
      - 'test/bip-companion-internal-proof.test.mjs'
      - 'wrangler.bip.toml'
      - 'test/bip-companion-isolation.test.mjs'
      - 'scripts/run-with-normalized-cloudflare-token.mjs'
      - 'test/cloudflare-token-verification-fallback.test.mjs'
      - 'test/cloudflare-branch-authority-workflow-contract.test.mjs'
      - 'test/cloudflare-branch-authority-apply-workflow-contract.test.mjs'
      - '.github/workflows/verify-cloudflare-authority-source.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  source-proof:
    name: Cloudflare authority source regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact source head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Require exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Run secretless Cloudflare source and authority regression tests
        run: >-
          node --test
          test/cloudflare-token-verification-fallback.test.mjs
          test/cloudflare-branch-authority-workflow-contract.test.mjs
          test/cloudflare-branch-authority-apply-workflow-contract.test.mjs
          test/bip-companion-isolation.test.mjs
          test/bip-companion-internal-proof.test.mjs

  companion-compile-proof:
    name: Isolated bip Worker Wrangler dry-run (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_ACCOUNT_ID: ''
    steps:
      - name: Check out the exact source head without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Require exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type-check the new internal proof contract without touching other source
        run: ./node_modules/.bin/tsc --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --lib es2022,dom --types node worker/companion-internal-proof.ts
      - name: Compile isolated bip without Cloudflare credentials or provider writes
        run: npx --no-install wrangler deploy --config wrangler.bip.toml --dry-run --outdir /tmp/bip-companion-dryrun
      - name: Ensure generated companion bundle contains no privileged platform modules
        run: |
          test -d /tmp/bip-companion-dryrun
          if grep -R -E 'SUPABASE_SERVICE_ROLE_KEY|handleBridgeSummaryGenerate|emailRouter|BRIDGE_SUMMARIES_ROLLOUT' /tmp/bip-companion-dryrun; then
            echo 'Companion bundle includes privileged platform functionality' >&2
            exit 1
          fi
