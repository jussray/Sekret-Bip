<svg width="1170" height="2532" viewBox="0 0 1170 2532" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1170" height="2532" fill="#0D0618"/>
  <text x="72" y="96" fill="#C4B5FD" font-family="Inter, Arial" font-size="28" font-weight="700" letter-spacing="4">SE'KRET BIP / USER ROOM</text>
  <text x="72" y="156" fill="white" font-family="Inter, Arial" font-size="44" font-weight="800">Daily Intentions component</text>
  <text x="72" y="204" fill="#AFA4C5" font-family="Inter, Arial" font-size="24">Figma handoff · local-first · opt-in personalization</text>

  <g id="expanded-card" transform="translate(72 300)">
    <rect width="1026" height="720" rx="44" fill="#160B2A" stroke="#8F7AB9" stroke-width="3"/>
    <text x="44" y="66" fill="#C4B5FD" font-family="Inter, Arial" font-size="22" font-weight="800" letter-spacing="4">TODAY, GENTLY</text>
    <text x="44" y="116" fill="white" font-family="Inter, Arial" font-size="38" font-weight="800">your 3 small things</text>
    <rect x="886" y="46" width="92" height="54" rx="27" fill="#2A1A43"/>
    <text x="916" y="81" fill="#DDD6FE" font-family="Inter, Arial" font-size="24" font-weight="800">1/3</text>
    <line x1="44" y1="150" x2="982" y2="150" stroke="#46355E"/>

    <rect x="44" y="196" width="48" height="48" rx="14" fill="#8B5CF6" stroke="#C4B5FD" stroke-width="2"/>
    <path d="M57 220L67 230L82 210" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="116" y="228" fill="#877B9B" font-family="Inter, Arial" font-size="28" text-decoration="line-through">Take one two-minute reset before the next thing.</text>

    <rect x="44" y="292" width="48" height="48" rx="14" stroke="#A78BFA" stroke-width="3"/>
    <text x="116" y="326" fill="#F5F3FF" font-family="Inter, Arial" font-size="28" font-weight="600">Pick one 10-minute next step — only one.</text>

    <rect x="44" y="388" width="48" height="48" rx="14" stroke="#A78BFA" stroke-width="3"/>
    <text x="116" y="422" fill="#F5F3FF" font-family="Inter, Arial" font-size="28" font-weight="600">Write one honest sentence in Pages.</text>

    <text x="44" y="520" fill="#C4B5FD" font-family="Inter, Arial" font-size="23" font-weight="700">↻ refresh</text>
    <text x="824" y="520" fill="#C4B5FD" font-family="Inter, Arial" font-size="23" font-weight="700">ⓘ privacy</text>
    <text x="44" y="574" fill="#988DAA" font-family="Inter, Arial" font-size="21">Checked on this device from up to 3 recent companion pages.</text>
    <text x="44" y="608" fill="#988DAA" font-family="Inter, Arial" font-size="21">No quotes saved.</text>

    <rect x="44" y="650" width="938" height="2" fill="#342545"/>
    <text x="44" y="692" fill="#756A86" font-family="Inter, Arial" font-size="19">ANCHOR: bottom-left, 14px inset · max-width 340px at runtime · above bottom nav</text>
  </g>

  <g id="privacy-sheet" transform="translate(72 1120)">
    <rect width="1026" height="1240" rx="54" fill="#160B29" stroke="#59466F" stroke-width="3"/>
    <text x="52" y="78" fill="#A78BFA" font-family="Inter, Arial" font-size="22" font-weight="900" letter-spacing="4">YOU CONTROL THIS</text>
    <text x="52" y="142" fill="white" font-family="Inter, Arial" font-size="42" font-weight="900">Helpful, not watching you.</text>
    <text x="52" y="210" fill="#DDD6FE" font-family="Inter, Arial" font-size="25">Basic mode uses mood + broad actions.</text>
    <text x="52" y="252" fill="#DDD6FE" font-family="Inter, Arial" font-size="25">Personalized mode checks up to 3 user-written entries locally.</text>

    <rect x="52" y="302" width="922" height="174" rx="28" fill="#24123C" stroke="#5E4779"/>
    <text x="82" y="356" fill="#EDE9FE" font-family="Inter, Arial" font-size="23" font-weight="600">Never saved: journal text, quotes, companion replies,</text>
    <text x="82" y="394" fill="#EDE9FE" font-family="Inter, Arial" font-size="23" font-weight="600">voice transcripts, or parent summaries.</text>
    <text x="82" y="442" fill="#EDE9FE" font-family="Inter, Arial" font-size="23" font-weight="600">Never shown to parents.</text>

    <g transform="translate(52 530)">
      <rect width="922" height="142" rx="28" fill="#281743" stroke="#A78BFA" stroke-width="3"/>
      <circle cx="50" cy="71" r="24" fill="#8B5CF6" stroke="#C4B5FD" stroke-width="2"/>
      <path d="M39 71L47 79L62 62" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="96" y="62" fill="#F5F3FF" font-family="Inter, Arial" font-size="27" font-weight="800">Use recent companion entries</text>
      <text x="96" y="99" fill="#AFA4C5" font-family="Inter, Arial" font-size="21">More personal · still processed locally</text>
    </g>

    <g transform="translate(52 702)">
      <rect width="922" height="142" rx="28" fill="#160B29" stroke="#4B3B60" stroke-width="2"/>
      <circle cx="50" cy="71" r="24" stroke="#7C6B9C" stroke-width="3"/>
      <text x="96" y="62" fill="#F5F3FF" font-family="Inter, Arial" font-size="27" font-weight="800">Use basic signals only</text>
      <text x="96" y="99" fill="#AFA4C5" font-family="Inter, Arial" font-size="21">Mood + broad app actions</text>
    </g>

    <g transform="translate(52 874)">
      <rect width="922" height="142" rx="28" fill="#160B29" stroke="#4B3B60" stroke-width="2"/>
      <circle cx="50" cy="71" r="24" stroke="#7C6B9C" stroke-width="3"/>
      <text x="96" y="62" fill="#F5F3FF" font-family="Inter, Arial" font-size="27" font-weight="800">Turn daily intentions off</text>
      <text x="96" y="99" fill="#AFA4C5" font-family="Inter, Arial" font-size="21">Clears today's saved checklist</text>
    </g>

    <text x="486" y="1110" text-anchor="middle" fill="#C4B5FD" font-family="Inter, Arial" font-size="25" font-weight="800">close</text>
    <text x="52" y="1190" fill="#766B87" font-family="Inter, Arial" font-size="19">Component states: expanded · collapsed · off pill · privacy sheet</text>
  </g>
</svg>
